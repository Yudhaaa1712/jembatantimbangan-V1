<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Hutang - Weighbridge Arroyan</title>
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/sweetalert2.min.css">
  <link rel="stylesheet" href="/assets/css/bw-theme.css">
  <link rel="stylesheet" href="/assets/css/pages/masterdata-bw.css">
  <style>
    .list-group-item-custom {
      background-color: #ffffff;
      color: var(--text-primary);
      border: 1px solid var(--border-light);
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .list-group-item-custom:hover {
      background-color: var(--hover-light);
    }

    .list-group-item-custom.active {
      background-color: var(--accent-dark) !important;
      border-color: var(--border-color) !important;
      color: #ffffff !important;
    }

    .list-group-item-custom.active .text-muted {
      color: #e2e8f0 !important;
    }

    .history-container {
      max-height: 400px;
      overflow-y: auto;
    }
  </style>
</head>

<body>
  <div id="site-header"></div>
  <div class="main-container">
    <div class="page-header d-flex justify-content-between align-items-center">
      <h1 class="page-title"><i class="bi bi-wallet2"></i> Manajemen Hutang</h1>
      <button class="btn btn-outline-success" onclick="window.location.href = '/hutang-supir-api/export-excel'">
        <i class="bi bi-file-earmark-excel-fill"></i> Export Rekap Excel
      </button>
    </div>

    <div class="row g-4 mt-1">
      <!-- Supir List Column -->
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fs-6">Daftar Nama</h5>
            <button class="btn btn-sm btn-primary" id="btnRegister"><i class="bi bi-person-plus-fill"></i> Tambah</button>
          </div>
          <div class="card-body p-2">
            <select id="tipeHutang" class="form-select form-select-sm mb-2">
              <option value="supir">Supir</option>
              <option value="supplier">Supplier</option>
            </select>
            <input type="text" id="searchInput" class="form-control form-control-sm mb-2" placeholder="Cari nama supir...">
            <div class="list-group list-group-flush" id="listGroup" style="max-height: 500px; overflow-y: auto;">
              <!-- Dynamic list -->
              <div class="text-muted text-center p-3">Memuat data...</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Supir Detail Column -->
      <div class="col-md-8">
        <div class="card shadow-sm h-100" id="detailCard" style="display: none;">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fs-6" id="detailSupirName">Detail Hutang</h5>
            <div>
              <button class="btn btn-sm btn-success me-1" id="btnBayar"><i class="bi bi-cash-stack"></i> Bayar
                Hutang</button>
              <button class="btn btn-sm btn-warning" id="btnTambah"><i class="bi bi-plus-circle"></i> Tambah
                Hutang</button>
            </div>
          </div>
          <div class="card-body">
            <div class="row mb-3 p-3 rounded"
              style="background: var(--bg-secondary); border: 1px solid var(--border-light);">
              <div class="col-6">
                <span class="text-muted small">Total Sisa Hutang</span>
                <h3 class="text-danger fw-bold mb-0" id="detailTotalHutang">Rp 0</h3>
              </div>
              <div class="col-6 text-end">
                <span class="text-muted small">Status</span>
                <h4 id="detailStatus" class="mb-0 mt-1"><span class="badge bg-success">Aktif</span></h4>
              </div>
            </div>

            <h5 class="fs-6 mb-2"><i class="bi bi-clock-history"></i> Histori Pembayaran & Hutang</h5>
            <div class="history-container table-container">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Tanggal</th>
                    <th>Jenis</th>
                    <th>Jumlah</th>
                    <th>Sisa Saldo</th>
                    <th>Keterangan</th>
                    <th>Operator</th>
                  </tr>
                </thead>
                <tbody id="historyBody">
                  <!-- Dynamic history rows -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="card shadow-sm h-100 d-flex align-items-center justify-content-center text-muted p-5"
          id="noSelectionPlaceholder">
          <div class="text-center">
            <i class="bi bi-wallet-fill display-1 text-secondary"></i>
            <p class="mt-3">Pilih nama dari daftar untuk melihat detail histori hutang.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/assets/js/jquery-3.7.1.min.js"></script>
  <script src="/assets/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/sweetalert2.min.js"></script>
  <script>
    window.activePage = 'hutang';
    let currentType = 'supir'; // 'supir' or 'supplier'
    let dataList = [];
    let selectedId = null;

    function formatRupiah(number) {
      return 'Rp ' + new Intl.NumberFormat('id-ID').format(number);
    }

    document.getElementById('tipeHutang').addEventListener('change', async (e) => {
      currentType = e.target.value;
      selectedId = null;
      document.getElementById('noSelectionPlaceholder').style.display = 'flex';
      document.getElementById('detailCard').style.display = 'none';
      document.getElementById('searchInput').placeholder = currentType === 'supir' ? 'Cari nama supir...' : 'Cari nama supplier...';
      document.getElementById('searchInput').value = '';
      await loadData();
    });

    async function loadData() {
      try {
        const endpoint = currentType === 'supir' ? '/hutang-supir-api/supir-aktif' : '/hutang-supir-api/supplier-aktif';
        const res = await fetch(endpoint);
        const r = await res.json();
        if (r.success) {
          dataList = r.data;
          renderList();
        }
      } catch (e) {
        console.error(e);
      }
    }

    function renderList() {
      const searchVal = document.getElementById('searchInput').value.toUpperCase();
      const container = document.getElementById('listGroup');
      container.innerHTML = '';
      const nameKey = currentType === 'supir' ? 'nama_supir' : 'nama_supplier';

      const filtered = dataList.filter(s => s[nameKey].toUpperCase().includes(searchVal));

      if (filtered.length === 0) {
        container.innerHTML = '<div class="text-muted text-center p-3">Nama tidak ditemukan</div>';
        return;
      }

      filtered.forEach(s => {
        const item = document.createElement('div');
        item.className = `list-group-item list-group-item-custom d-flex justify-content-between align-items-center ${selectedId === s.id ? 'active' : ''}`;
        item.onclick = () => selectItem(s.id);

        item.innerHTML = `
        <div>
          <strong class="d-block">${s[nameKey]}</strong>
          <span class="small text-muted">${currentType === 'supir' ? (s.no_telepon || '-') : (s.kode_supplier || '-')}</span>
        </div>
        <span class="badge ${s.total_hutang > 0 ? 'bg-danger' : 'bg-success'} rounded-pill">
          ${formatRupiah(s.total_hutang)}
        </span>
      `;
        container.appendChild(item);
      });
    }

    async function selectItem(id) {
      selectedId = id;

      // Highlight item
      document.querySelectorAll('.list-group-item-custom').forEach(el => el.classList.remove('active'));
      renderList();

      const itemData = dataList.find(s => s.id === id);
      if (!itemData) return;

      const nameKey = currentType === 'supir' ? 'nama_supir' : 'nama_supplier';

      // Show details panel
      document.getElementById('noSelectionPlaceholder').style.display = 'none';
      document.getElementById('detailCard').style.display = 'block';

      document.getElementById('detailSupirName').innerHTML = `<i class="bi bi-person-fill"></i> Detail Hutang: ${itemData[nameKey]}`;
      document.getElementById('detailTotalHutang').textContent = formatRupiah(itemData.total_hutang);
      document.getElementById('detailStatus').innerHTML = itemData.status === 'active'
        ? '<span class="badge bg-success">Aktif</span>'
        : '<span class="badge bg-secondary">Nonaktif</span>';

      // Load History
      const historyBody = document.getElementById('historyBody');
      historyBody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Memuat histori...</td></tr>';

      try {
        const endpoint = currentType === 'supir' ? `/hutang-supir-api/supir/${id}/history` : `/hutang-supir-api/supplier/${id}/history`;
        const res = await fetch(endpoint);
        const r = await res.json();
        if (r.success) {
          if (r.data.length === 0) {
            historyBody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Belum ada histori transaksi</td></tr>';
            return;
          }
          historyBody.innerHTML = r.data.map(h => {
            const badge = h.jenis === 'tambah'
              ? '<span class="badge bg-danger">Hutang</span>'
              : '<span class="badge bg-success">Bayar</span>';
            const tgl = new Date(h.tanggal).toLocaleDateString('id-ID');
            return `
            <tr>
              <td>${tgl}</td>
              <td class="text-center">${badge}</td>
              <td class="text-end fw-bold">${formatRupiah(h.jumlah)}</td>
              <td class="text-end text-warning">${formatRupiah(h.saldo_setelah)}</td>
              <td>${h.keterangan || '-'}</td>
              <td>${h.nama_operator || '-'}</td>
            </tr>
          `;
          }).join('');
        } else {
          historyBody.innerHTML = `<tr><td colspan="6" class="text-center text-danger">${r.message}</td></tr>`;
        }
      } catch (e) {
        historyBody.innerHTML = '<tr><td colspan="6" class="text-center text-danger">Gagal memuat data</td></tr>';
      }
    }

    // Handle search input
    document.getElementById('searchInput').addEventListener('input', renderList);

    // Handle Bayar Hutang
    document.getElementById('btnBayar').addEventListener('click', async () => {
      if (!selectedId) return;
      const itemData = dataList.find(s => s.id === selectedId);
      if (!itemData) return;
      
      const nameKey = currentType === 'supir' ? 'nama_supir' : 'nama_supplier';

      const { value: formValues } = await Swal.fire({
        title: `Bayar Hutang: ${itemData[nameKey]}`,
        html: `
        <div class="mb-3 text-start">
          <label class="form-label">Jumlah Pembayaran (Rp)</label>
          <input id="swal-bayar-jumlah" type="number" class="form-control" placeholder="0" max="${itemData.total_hutang}">
        </div>
        <div class="mb-3 text-start">
          <label class="form-label">Keterangan</label>
          <input id="swal-bayar-ket" class="form-control" value="Pembayaran manual">
        </div>
        <div class="mb-3 text-start">
          <label class="form-label">Tanggal</label>
          <input id="swal-bayar-tgl" type="date" class="form-control" value="${new Date().toISOString().split('T')[0]}">
        </div>
      `,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: 'Bayar',
        cancelButtonText: 'Batal',
        preConfirm: () => {
          const jumlah = parseFloat(document.getElementById('swal-bayar-jumlah').value);
          if (isNaN(jumlah) || jumlah <= 0) {
            Swal.showValidationMessage('Jumlah pembayaran harus valid dan lebih dari 0');
            return false;
          }
          const idKey = currentType === 'supir' ? 'id_supir' : 'id_supplier';
          return {
            [idKey]: selectedId,
            jumlah: jumlah,
            keterangan: document.getElementById('swal-bayar-ket').value,
            tanggal: document.getElementById('swal-bayar-tgl').value
          };
        }
      });

      if (formValues) {
        try {
          const endpoint = currentType === 'supir' ? '/hutang-supir-api/bayar' : '/hutang-supir-api/supplier/bayar';
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formValues)
          });
          const r = await res.json();
          if (r.success) {
            Swal.fire({ icon: 'success', title: 'Berhasil', text: r.message, timer: 1500, showConfirmButton: false });
            await loadData();
            await selectItem(selectedId);
          } else {
            Swal.fire({ icon: 'error', title: 'Gagal', text: r.message });
          }
        } catch (err) {
          Swal.fire({ icon: 'error', title: 'Error', text: 'Gagal memproses transaksi' });
        }
      }
    });

    // Handle Tambah Hutang
    document.getElementById('btnTambah').addEventListener('click', async () => {
      if (!selectedId) return;
      const itemData = dataList.find(s => s.id === selectedId);
      if (!itemData) return;
      
      const nameKey = currentType === 'supir' ? 'nama_supir' : 'nama_supplier';

      const { value: formValues } = await Swal.fire({
        title: `Tambah Hutang: ${itemData[nameKey]}`,
        html: `
        <div class="mb-3 text-start">
          <label class="form-label">Jumlah Penambahan Hutang (Rp)</label>
          <input id="swal-tambah-jumlah" type="number" class="form-control" placeholder="0">
        </div>
        <div class="mb-3 text-start">
          <label class="form-label">Keterangan</label>
          <input id="swal-tambah-ket" class="form-control" value="Penambahan manual">
        </div>
        <div class="mb-3 text-start">
          <label class="form-label">Tanggal</label>
          <input id="swal-tambah-tgl" type="date" class="form-control" value="${new Date().toISOString().split('T')[0]}">
        </div>
      `,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: 'Tambah',
        cancelButtonText: 'Batal',
        preConfirm: () => {
          const jumlah = parseFloat(document.getElementById('swal-tambah-jumlah').value);
          if (isNaN(jumlah) || jumlah <= 0) {
            Swal.showValidationMessage('Jumlah penambahan harus valid dan lebih dari 0');
            return false;
          }
          const idKey = currentType === 'supir' ? 'id_supir' : 'id_supplier';
          return {
            [idKey]: selectedId,
            jumlah: jumlah,
            keterangan: document.getElementById('swal-tambah-ket').value,
            tanggal: document.getElementById('swal-tambah-tgl').value
          };
        }
      });

      if (formValues) {
        try {
          const endpoint = currentType === 'supir' ? '/hutang-supir-api/tambah' : '/hutang-supir-api/supplier/tambah';
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formValues)
          });
          const r = await res.json();
          if (r.success) {
            Swal.fire({ icon: 'success', title: 'Berhasil', text: r.message, timer: 1500, showConfirmButton: false });
            await loadData();
            await selectItem(selectedId);
          } else {
            Swal.fire({ icon: 'error', title: 'Gagal', text: r.message });
          }
        } catch (err) {
          Swal.fire({ icon: 'error', title: 'Error', text: 'Gagal memproses transaksi' });
        }
      }
    });

    // Handle Register Baru
    document.getElementById('btnRegister').addEventListener('click', async () => {
      const typeLabel = currentType === 'supir' ? 'Supir' : 'Supplier';
      const nameKey = currentType === 'supir' ? 'nama_supir' : 'nama_supplier';
      
      const { value: formValues } = await Swal.fire({
        title: `Pendaftaran ${typeLabel} Baru`,
        html: `
        <div class="mb-3 text-start">
          <label class="form-label">Nama ${typeLabel}</label>
          <input id="swal-reg-nama" class="form-control" placeholder="Nama">
        </div>
        <div class="mb-3 text-start">
          <label class="form-label">Hutang Awal (Rp - Opsional)</label>
          <input id="swal-reg-hutang" type="number" class="form-control" value="0">
        </div>
      `,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: 'Daftarkan',
        cancelButtonText: 'Batal',
        preConfirm: () => {
          const nama = document.getElementById('swal-reg-nama').value.trim();
          if (!nama) {
            Swal.showValidationMessage('Nama harus diisi');
            return false;
          }
          return {
            [nameKey]: nama,
            no_telepon: '',
            alamat: '',
            initial_debt: parseFloat(document.getElementById('swal-reg-hutang').value) || 0
          };
        }
      });

      if (formValues) {
        try {
          const endpoint = currentType === 'supir' ? '/hutang-supir-api/supir/add' : '/hutang-supir-api/supplier/add';
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formValues)
          });
          const r = await res.json();
          if (r.success) {
            Swal.fire({ icon: 'success', title: 'Berhasil', text: r.message, timer: 1500, showConfirmButton: false });
            await loadData();
          } else {
            Swal.fire({ icon: 'error', title: 'Gagal', text: r.message });
          }
        } catch (err) {
          Swal.fire({ icon: 'error', title: 'Error', text: 'Gagal mendaftarkan nama baru' });
        }
      }
    });

    document.addEventListener('DOMContentLoaded', async function () {
      await loadSessionInfo();
      await loadData();
    });
  </script>
  <script src="/js/sidebar.js"></script>
</body>

</html>
