<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaksi - Weighbridge Arroyan</title>
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/sweetalert2.min.css">
  <link rel="stylesheet" href="/assets/css/bw-theme.css">
  <link rel="stylesheet" href="/assets/css/pages/transaksi-bw.css">
</head>
<body>
  <div id="site-header"></div>
  <div class="main-container">
    <div class="page-header"><h1 class="page-title">Data Transaksi</h1></div>

    <!-- Filter -->
    <div class="filter-section">
      <div class="filter-row" style="align-items:flex-end;gap:15px;">
        <div class="filter-group">
          <label>Pilih Periode</label>
          <select id="dateFilterSelect" class="filter-control" onchange="handleFilterChange()">
            <option value="today">Hari Ini</option>
            <option value="yesterday">Kemarin</option>
            <option value="week">7 Hari Terakhir</option>
            <option value="half_month">15 Hari Terakhir</option>
            <option value="month">Bulan Ini</option>
            <option value="half_year">6 Bulan Terakhir</option>
            <option value="year">Tahun Ini</option>
            <option value="custom_range">Pilih Tanggal (Custom)</option>
          </select>
        </div>
        <div id="customDateRow" style="display:none;gap:10px;align-items:flex-end;">
          <div class="filter-group"><label>Dari Tanggal</label><input type="date" id="startDateInput" class="filter-control"></div>
          <div class="filter-group"><label>Sampai Tanggal</label><input type="date" id="endDateInput" class="filter-control"></div>
          <button class="btn-filter" style="height:42px;" onclick="loadTransaksi()"><i class="fas fa-search"></i> Cari</button>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-section">
      <div class="stat-card">
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-label">Total Transaksi</div>
      </div>
    </div>

    <!-- Actions -->
    <div class="action-section">
      <div class="action-buttons">
        <button class="btn-action bg-neoYellow hover:bg-[#ffeb33] text-black font-extrabold" id="btnToggleMode" onclick="toggleViewMode()">
          <i class="fas fa-compress-alt" id="toggleIcon"></i> <span id="toggleText">MODE: RINGKAS (FIT LAYAR)</span>
        </button>
        <button class="btn-action bg-white hover:bg-neoYellow text-black" id="btnExportExcel" onclick="exportExcel()">EXPORT EXCEL</button>
        <button class="btn-action bg-neoGreen hover:bg-[#33ff85] text-black" id="btnSendEmail" onclick="sendReportEmail('transaksi')">📧 KIRIM KE EMAIL</button>
      </div>
      <div class="total-records"><span id="totalRecords" class="font-extrabold text-black" style="color:#000000 !important;">Total Records: 0</span></div>
    </div>

    <!-- Table -->
    <div class="table-container">
      <table class="data-table" id="transaksiTable">
        <thead>
            <!-- will be populated dynamically -->
        </thead>
        <tbody id="transaksiBody"><tr><td colspan="21" style="text-align:center;">Memuat data...</td></tr></tbody>
      </table>
    </div>
  </div>

  <script src="/assets/js/jquery-3.7.1.min.js"></script>
  <script src="/assets/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/sweetalert2.min.js"></script>
  <script>
  window.activePage = 'transaksi';
  let currentViewMode = localStorage.getItem('tx_view_mode') || 'compact';
  let rawDataCache = [];

  function updateToggleBtnUI() {
    const icon = document.getElementById('toggleIcon');
    const text = document.getElementById('toggleText');
    const btn = document.getElementById('btnToggleMode');
    if (currentViewMode === 'compact') {
      icon.className = 'fas fa-compress-alt';
      text.textContent = 'MODE: RINGKAS (FIT LAYAR)';
      btn.className = 'btn-action bg-neoYellow hover:bg-[#ffeb33] text-black font-extrabold';
    } else {
      icon.className = 'fas fa-expand-alt';
      text.textContent = 'MODE: LENGKAP (GRID)';
      btn.className = 'btn-action bg-neoBlue hover:bg-[#3385ff] text-white font-extrabold';
    }
  }

  function toggleViewMode() {
    currentViewMode = currentViewMode === 'compact' ? 'full' : 'compact';
    localStorage.setItem('tx_view_mode', currentViewMode);
    updateToggleBtnUI();
    renderTable();
  }

  function handleFilterChange() {
    const val = document.getElementById('dateFilterSelect').value;
    const customRow = document.getElementById('customDateRow');
    if (val === 'custom_range') { customRow.style.display='flex'; }
    else { customRow.style.display='none'; loadTransaksi(); }
  }

  let lastResultConfig = null;

  async function loadTransaksi() {
    const filter = document.getElementById('dateFilterSelect').value;
    const start = document.getElementById('startDateInput').value;
    const end = document.getElementById('endDateInput').value;
    let url = `/transaksi/list?date_filter=${filter}`;
    if (filter === 'custom_range' && start && end) url += `&start_date=${start}&end_date=${end}`;

    const res = await fetch(url);
    const result = await res.json();
    if (!result.success) return;

    rawDataCache = result.data || [];
    lastResultConfig = result;

    document.getElementById('statTotal').textContent = result.stats?.total_transaksi || 0;
    document.getElementById('totalRecords').textContent = `Total Records: ${result.total}`;

    updateToggleBtnUI();
    renderTable();
  }

  function renderTable() {
    if (!lastResultConfig) return;
    const result = lastResultConfig;
    const tbody = document.getElementById('transaksiBody');
    const thead = document.querySelector('#transaksiTable thead');

    if (!result.data || result.data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="25" style="text-align:center;">Tidak ada data transaksi</td></tr>';
      return;
    }

    const t1 = result.fields?.t1 || { no_kendaraan: true, nama_pengemudi: true, nama_suplier: true, material: true, harga: true, keterangan: true };
    const t2 = result.fields?.t2 || { persen_potongan: true, harga: true, potongan_hutang: true, potongan_muat: true, keterangan: true };
    const activeFeatures = result.active_features || {};

    if (currentViewMode === 'compact') {
      // ── MODE RINGKAS (NO SCROLL, FIT IN SCREEN) ───────────────────────────
      thead.innerHTML = `
        <tr>
          <th style="vertical-align: middle; text-align: center; width: 40px;">NO</th>
          <th style="vertical-align: middle;">NO. TIKET & STATUS</th>
          <th style="vertical-align: middle;">TANGGAL & WAKTU</th>
          <th style="vertical-align: middle;">NO. POLISI</th>
          <th style="vertical-align: middle;">SUPIR & SUPPLIER</th>
          <th style="vertical-align: middle;">MATERIAL</th>
          <th style="vertical-align: middle; text-align: right;">NETTO 2 (KG)</th>
          <th style="vertical-align: middle; text-align: right;">TOTAL AKHIR</th>
          <th style="vertical-align: middle; text-align: center; width: 140px;">AKSI</th>
        </tr>
      `;

      let html = '';
      result.data.forEach((row, i) => {
        const isCancel = row.status === 'dibatalkan';
        const style = isCancel ? 'opacity:0.55;background:#fef2f2;' : 'cursor:pointer;';
        const bruto = parseFloat(row.berat_bruto) || parseFloat(row.berat_timbangan1) || 0;
        const tara = parseFloat(row.berat_tara) || parseFloat(row.berat_timbangan2) || 0;
        const persen = parseFloat(row.persen_potongan||0);
        const harga = parseFloat(row.harga_per_kg||0);
        const nettoAwal = bruto - tara;
        const kgPot = Math.round((persen/100)*nettoAwal);
        const nettoAkhir = Math.round(nettoAwal - kgPot);
        const totalAwal = parseFloat(row.total_harga) > 0 ? parseFloat(row.total_harga) : nettoAkhir*harga;
        const potPupuk = parseFloat(row.potongan_pupuk_rp||0);
        const potHutang = parseFloat(row.potongan_hutang_rp||0);
        const potJalan = parseFloat(row.potongan_jalan||0);
        const potMuat = parseFloat(row.potongan_muat_rp||0);
        const totalPotRp = potPupuk+potHutang+potJalan+potMuat;
        const totalAkhir = Math.max(0, totalAwal - totalPotRp);
        const fmtDate = row.tanggal ? new Date(row.tanggal).toLocaleDateString('id-ID', { day:'2-digit', month:'2-digit', year:'numeric' }) : '-';

        const extractTimeOnly = (str) => {
          if (!str) return '-';
          const timeStr = String(str).includes(' ') ? String(str).split(' ')[1] : String(str);
          return timeStr ? timeStr.slice(0, 5) : '-';
        };
        const fmtT1 = extractTimeOnly(row.waktu_timbangan1);
        const fmtKeluar = extractTimeOnly(row.waktu_keluar);

        const statusBadge = isCancel
          ? `<span class="badge bg-red-600 text-white border border-black rounded-none shadow-[1px_1px_0px_0px_rgba(0,0,0,1)] text-[10px]">BATAL</span>`
          : `<span class="badge bg-emerald-600 text-white border border-black rounded-none shadow-[1px_1px_0px_0px_rgba(0,0,0,1)] text-[10px]">SELESAI</span>`;

        html += `<tr style="${style}" onclick="showDetailModal(${i})">
          <td style="text-align:center;">${i+1}</td>
          <td>
            <strong class="text-black text-sm">${row.no_tiket}</strong><br>
            ${statusBadge}
          </td>
          <td>
            <span class="text-xs font-bold">${fmtDate}</span><br>
            <span class="text-[11px] text-gray-600"><i class="far fa-clock"></i> ${fmtT1} ${fmtKeluar !== '-' ? '→ ' + fmtKeluar : ''}</span>
          </td>
          <td><strong class="text-black uppercase text-sm">${(row.no_polisi||'-').toUpperCase()}</strong></td>
          <td>
            <span class="font-bold text-black uppercase">${(row.nama_supir||'-').toUpperCase()}</span><br>
            <small class="text-gray-500 uppercase text-[11px]">${(row.nama_supplier||'-').toUpperCase()}</small>
          </td>
          <td><span class="badge bg-neoYellow text-black border border-black font-extrabold text-xs uppercase px-2 py-1">${(row.jenis_material||'-').toUpperCase()}</span></td>
          <td style="text-align:right; font-weight:900; font-size:14px; color:#000;">${nettoAkhir.toLocaleString('id-ID')} Kg</td>
          <td style="text-align:right; font-weight:900; font-size:14px; color:#059669;">${totalAkhir > 0 ? 'Rp ' + totalAkhir.toLocaleString('id-ID') : '-'}</td>
          <td style="white-space:nowrap; text-align:center;" onclick="event.stopPropagation();">
            <button class="btn btn-sm bg-neoBlue hover:bg-[#3385ff] text-white border border-black font-black text-xs px-2 py-1 shadow-[1px_1px_0px_0px_rgba(0,0,0,1)] me-1" onclick="showDetailModal(${i})" title="Lihat Detail Lengkap"><i class="fas fa-eye"></i></button>
            ${!isCancel ? `<button class="btn-receipt me-1" onclick="printReceipt('${row.no_tiket}')" title="Cetak Struk"><i class="fas fa-print"></i></button>` : ''}
            ${!isCancel && (currentUser?.user_role==='admin'||currentUser?.user_role==='operator') ? `<button class="btn btn-sm bg-red-600 hover:bg-red-700 text-white border border-black font-black text-xs px-2 py-1 shadow-[1px_1px_0px_0px_rgba(0,0,0,1)]" onclick="cancelTransaction(${row.id},'${row.no_tiket}')" title="Batalkan"><i class="fas fa-times"></i></button>` : ''}
          </td>
        </tr>`;
      });
      tbody.innerHTML = html;

    } else {
      // ── MODE LENGKAP (FULL GRID WITH STICKY LEFT COLUMNS) ─────────────────
      let kendCols = 0;
      if (t1.no_kendaraan !== false) kendCols++;
      if (t1.nama_pengemudi !== false) kendCols++;
      let supCols = 0;
      if (t1.nama_suplier !== false) supCols++;
      if (t1.material !== false) supCols++;
      const showPot = t2.persen_potongan !== false;
      const showHarga = (t1.harga !== false || t2.harga !== false);
      const showHutang = (activeFeatures.hutang === true && t2.potongan_hutang !== false) || (t2.potongan_muat !== false);
      const showKet = (t1.keterangan !== false || t2.keterangan !== false);

      let theadHtml = `
        <tr>
          <th rowspan="2" style="vertical-align: middle;" class="sticky-col">NO</th>
          <th rowspan="2" style="vertical-align: middle;" class="sticky-col-2">NO. TIKET</th>
          <th rowspan="2" style="vertical-align: middle;">STATUS</th>
          <th rowspan="2" style="vertical-align: middle;">TANGGAL</th>
          <th colspan="2" style="text-align: center;">WAKTU</th>
          ${kendCols > 0 ? `<th colspan="${kendCols}" style="text-align: center;">KENDARAAN</th>` : ''}
          ${supCols > 0 ? `<th colspan="${supCols}" style="text-align: center;">SUPPLIER</th>` : ''}
          <th colspan="3" style="text-align: center;">TIMBANGAN (KG)</th>
          ${showPot ? `<th colspan="2" style="text-align: center;">POTONGAN BERAT</th>` : ''}
          <th rowspan="2" style="vertical-align: middle;">NETTO 2 (KG)</th>
          ${showHarga ? `<th rowspan="2" style="vertical-align: middle;">HARGA</th><th rowspan="2" style="vertical-align: middle;">TOTAL AWAL</th>` : ''}
          ${showHutang ? `<th rowspan="2" style="vertical-align: middle;">POTONG HUTANG</th>` : ''}
          ${showHarga ? `<th rowspan="2" style="vertical-align: middle;">TOTAL AKHIR</th>` : ''}
          ${showKet ? `<th rowspan="2" style="vertical-align: middle;">KETERANGAN</th>` : ''}
          <th rowspan="2" style="vertical-align: middle;">OPERATOR</th>
          <th rowspan="2" style="vertical-align: middle;">AKSI</th>
        </tr>
        <tr>
          <th>MASUK</th>
          <th>KELUAR</th>
          ${t1.no_kendaraan !== false ? `<th>NO. POLISI</th>` : ''}
          ${t1.nama_pengemudi !== false ? `<th>SUPIR</th>` : ''}
          ${t1.nama_suplier !== false ? `<th>NAMA</th>` : ''}
          ${t1.material !== false ? `<th>MATERIAL</th>` : ''}
          <th>BRUTO</th>
          <th>TARA</th>
          <th>NETTO 1</th>
          ${showPot ? `<th>%</th><th>KG</th>` : ''}
        </tr>
      `;
      thead.innerHTML = theadHtml;

      let html = '';
      result.data.forEach((row, i) => {
        const isCancel = row.status === 'dibatalkan';
        const style = isCancel ? 'opacity:0.5;text-decoration:line-through;' : '';
        const bruto = parseFloat(row.berat_bruto) || parseFloat(row.berat_timbangan1) || 0;
        const tara = parseFloat(row.berat_tara) || parseFloat(row.berat_timbangan2) || 0;
        const persen = parseFloat(row.persen_potongan||0);
        const harga = parseFloat(row.harga_per_kg||0);
        const nettoAwal = bruto - tara;
        const kgPot = Math.round((persen/100)*nettoAwal);
        const nettoAkhir = Math.round(nettoAwal - kgPot);
        const totalAwal = parseFloat(row.total_harga) > 0 ? parseFloat(row.total_harga) : nettoAkhir*harga;
        const potPupuk = parseFloat(row.potongan_pupuk_rp||0);
        const potHutang = parseFloat(row.potongan_hutang_rp||0);
        const potJalan = parseFloat(row.potongan_jalan||0);
        const potMuat = parseFloat(row.potongan_muat_rp||0);
        const totalPotRp = potPupuk+potHutang+potJalan+potMuat;
        const totalAkhir = Math.max(0, totalAwal - totalPotRp);
        const fmtDate = row.tanggal ? new Date(row.tanggal).toLocaleDateString('id-ID') : '-';
        const extractTimeOnly = (str) => {
          if (!str) return '-';
          const timeStr = String(str).includes(' ') ? String(str).split(' ')[1] : String(str);
          return timeStr ? timeStr.slice(0, 8) : '-';
        };
        const fmtT1 = extractTimeOnly(row.waktu_timbangan1);
        const fmtKeluar = extractTimeOnly(row.waktu_keluar);
        const statusBadge = isCancel
          ? `<span class="status-badge status-pending">BATAL</span>`
          : `<span class="status-badge status-complete">SELESAI</span>`;
        const aksiBtn = isCancel
          ? `<span style="color:#6b7280;font-size:11px;">Dibatalkan</span>`
          : `<button class="btn-receipt me-1" onclick="printReceipt('${row.no_tiket}')">Cetak</button>
             ${ currentUser?.user_role==='admin'||currentUser?.user_role==='operator'
               ? `<button class="btn-receipt" style="background:#dc2626;color:white;" onclick="cancelTransaction(${row.id},'${row.no_tiket}')">Batalkan</button>` : ''}` ;

        html += `<tr style="${style}">
          <td class="sticky-col">${i+1}</td>
          <td class="sticky-col-2"><strong>${row.no_tiket}</strong></td>
          <td>${statusBadge}</td>
          <td>${fmtDate}</td><td>${fmtT1}</td><td>${fmtKeluar}</td>
          ${t1.no_kendaraan !== false ? `<td>${(row.no_polisi||'-').toUpperCase()}</td>` : ''}
          ${t1.nama_pengemudi !== false ? `<td>${(row.nama_supir||'-').toUpperCase()}</td>` : ''}
          ${t1.nama_suplier !== false ? `<td>${(row.nama_supplier||'-').toUpperCase()}</td>` : ''}
          ${t1.material !== false ? `<td>${(row.jenis_material||'-').toUpperCase()}</td>` : ''}
          <td style="text-align:right;">${bruto.toLocaleString('id-ID')}</td>
          <td style="text-align:right;">${tara.toLocaleString('id-ID')}</td>
          <td style="text-align:right;font-weight:bold;">${nettoAwal.toLocaleString('id-ID')}</td>
          ${showPot ? `<td style="text-align:center;">${persen>0?persen.toFixed(1)+'%':'-'}</td>
          <td style="text-align:right;">${kgPot>0?kgPot.toLocaleString('id-ID'):'-'}</td>` : ''}
          <td style="text-align:right;font-weight:bold;">${nettoAkhir.toLocaleString('id-ID')}</td>
          ${showHarga ? `<td style="text-align:right;">${harga>0?'Rp '+harga.toLocaleString('id-ID'):'-'}</td>
          <td style="text-align:right;">${totalAwal>0?'Rp '+totalAwal.toLocaleString('id-ID'):'-'}</td>` : ''}
          ${showHutang ? `<td style="text-align:right;color:#b8860b;font-weight:bold;">${totalPotRp>0?'- Rp '+totalPotRp.toLocaleString('id-ID'):'-'}</td>` : ''}
          ${showHarga ? `<td style="text-align:right;font-weight:bold;color:#008a36;">${totalAkhir>0?'Rp '+totalAkhir.toLocaleString('id-ID'):'-'}</td>` : ''}
          ${showKet ? `<td style="max-width:200px;">${row.keterangan||'-'}</td>` : ''}
          <td>${(row.operator_nama||'-').toUpperCase()}</td>
          <td style="white-space:nowrap;">${aksiBtn}</td>
        </tr>`;
      });
      tbody.innerHTML = html;
    }
  }

  function showDetailModal(index) {
    const row = rawDataCache[index];
    if (!row) return;

    const bruto = parseFloat(row.berat_bruto) || parseFloat(row.berat_timbangan1) || 0;
    const tara = parseFloat(row.berat_tara) || parseFloat(row.berat_timbangan2) || 0;
    const persen = parseFloat(row.persen_potongan||0);
    const harga = parseFloat(row.harga_per_kg||0);
    const nettoAwal = bruto - tara;
    const kgPot = Math.round((persen/100)*nettoAwal);
    const nettoAkhir = Math.round(nettoAwal - kgPot);
    const totalAwal = parseFloat(row.total_harga) > 0 ? parseFloat(row.total_harga) : nettoAkhir*harga;
    const potPupuk = parseFloat(row.potongan_pupuk_rp||0);
    const potHutang = parseFloat(row.potongan_hutang_rp||0);
    const potHutangSupplier = parseFloat(row.potongan_hutang_supplier_rp||0);
    const potJalan = parseFloat(row.potongan_jalan||0);
    const potMuat = parseFloat(row.potongan_muat_rp||0);
    const totalPotRp = potPupuk+potHutang+potHutangSupplier+potJalan+potMuat;
    const totalAkhir = Math.max(0, totalAwal - totalPotRp);
    const fmtDate = row.tanggal ? new Date(row.tanggal).toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' }) : '-';

    const extractTimeOnly = (str) => {
      if (!str) return '-';
      const timeStr = String(str).includes(' ') ? String(str).split(' ')[1] : String(str);
      return timeStr ? timeStr.slice(0, 5) : '-';
    };

    const isCancel = row.status === 'dibatalkan';

    Swal.fire({
      title: `<div style="text-align:left; font-size:18px; font-weight:900;" class="uppercase">📋 DETAIL TIKET ${row.no_tiket} ${isCancel ? '<span style="color:#dc2626;">(BATAL)</span>' : ''}</div>`,
      width: '650px',
      confirmButtonText: 'Tutup',
      confirmButtonColor: '#000000',
      html: `
        <div style="text-align:left; font-size:13px; font-weight:bold; color:#000;">
          <div style="background:#f4f4f0; border:2px solid #000; padding:10px; margin-bottom:12px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
              <span>TANGGAL: ${fmtDate}</span>
              <span>JAM: ${extractTimeOnly(row.waktu_timbangan1)} ${row.waktu_keluar ? '→ ' + extractTimeOnly(row.waktu_keluar) : ''}</span>
            </div>
            <div>OPERATOR: ${(row.operator_nama||'-').toUpperCase()}</div>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;">
            <div style="border:2px solid #000; padding:10px; background:#fff;">
              <div style="font-weight:900; border-bottom:2px solid #000; padding-bottom:4px; margin-bottom:6px;">🚛 DATA KENDARAAN & PARTI</div>
              <div>NO. POLISI : <strong>${(row.no_polisi||'-').toUpperCase()}</strong></div>
              <div>SUPIR      : ${(row.nama_supir||'-').toUpperCase()}</div>
              <div>SUPPLIER   : ${(row.nama_supplier||'-').toUpperCase()}</div>
              <div>MATERIAL   : <strong>${(row.jenis_material||'-').toUpperCase()}</strong></div>
            </div>

            <div style="border:2px solid #000; padding:10px; background:#fff;">
              <div style="font-weight:900; border-bottom:2px solid #000; padding-bottom:4px; margin-bottom:6px;">⚖️ RINCIAN TIMBANGAN</div>
              <div>BRUTO    : ${bruto.toLocaleString('id-ID')} Kg</div>
              <div>TARA     : ${tara.toLocaleString('id-ID')} Kg</div>
              <div>NETTO 1  : <strong>${nettoAwal.toLocaleString('id-ID')} Kg</strong></div>
              <div>POTONGAN : ${persen}% (${kgPot.toLocaleString('id-ID')} Kg)</div>
              <div style="font-size:14px; font-weight:900; color:#000; margin-top:4px;">NETTO 2 : ${nettoAkhir.toLocaleString('id-ID')} Kg</div>
            </div>
          </div>

          <div style="border:2px solid #000; padding:10px; background:#e6fffa; margin-bottom:12px;">
            <div style="font-weight:900; border-bottom:2px solid #000; padding-bottom:4px; margin-bottom:6px;">💰 PERHITUNGAN BAYAR</div>
            <div style="display:flex; justify-content:space-between;"><span>HARGA / KG:</span><span>Rp ${harga.toLocaleString('id-ID')}</span></div>
            <div style="display:flex; justify-content:space-between;"><span>TOTAL GROSS:</span><span>Rp ${totalAwal.toLocaleString('id-ID')}</span></div>
            ${potHutang > 0 ? `<div style="display:flex; justify-content:space-between; color:#dc2626;"><span>POT. HUTANG SUPIR:</span><span>- Rp ${potHutang.toLocaleString('id-ID')}</span></div>` : ''}
            ${potHutangSupplier > 0 ? `<div style="display:flex; justify-content:space-between; color:#dc2626;"><span>POT. HUTANG SUPPLIER:</span><span>- Rp ${potHutangSupplier.toLocaleString('id-ID')}</span></div>` : ''}
            ${potMuat > 0 ? `<div style="display:flex; justify-content:space-between; color:#dc2626;"><span>UPAH BONGKAR:</span><span>- Rp ${potMuat.toLocaleString('id-ID')}</span></div>` : ''}
            <div style="display:flex; justify-content:space-between; font-size:16px; font-weight:900; color:#059669; border-top:2px solid #000; margin-top:6px; padding-top:4px;">
              <span>TOTAL BAYAR:</span><span>Rp ${totalAkhir.toLocaleString('id-ID')}</span>
            </div>
          </div>

          ${row.keterangan ? `<div style="border:2px solid #000; padding:8px; background:#fff;">KETERANGAN: ${row.keterangan}</div>` : ''}
        </div>
      `
    });
  }

  async function cancelTransaction(id, noTiket) {
    const { value: formValues } = await Swal.fire({
      title: 'Batalkan Transaksi',
      html: `
        <div style="text-align: left; margin-bottom: 15px;">
            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Aksi Pembatalan:</label>
            <div style="margin-bottom: 5px;">
                <input type="radio" id="action_ulang" name="action_type" value="ulang_timbang" checked>
                <label for="action_ulang">Ulang Timbang (Kembali ke Timbangan 1)</label>
            </div>
            <div>
                <input type="radio" id="action_delete" name="action_type" value="delete">
                <label for="action_delete" style="color: #dc2626;">Hapus Permanen</label>
            </div>
        </div>
        <div style="text-align: left;">
            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Alasan Pembatalan:</label>
            <input id="cancel_reason" class="swal2-input" placeholder="Masukkan alasan..." style="margin: 0; width: 100%;">
        </div>
      `,
      focusConfirm: false,
      showCancelButton: true,
      confirmButtonText: 'Proses Pembatalan',
      cancelButtonText: 'Batal',
      confirmButtonColor: '#dc2626',
      preConfirm: () => {
        return {
          action_type: document.querySelector('input[name="action_type"]:checked').value,
          cancel_reason: document.getElementById('cancel_reason').value
        }
      }
    });

    if (!formValues) return;
    if (formValues.action_type === 'ulang_timbang' && !formValues.cancel_reason) {
        Swal.fire({ icon:'error', title:'Gagal', text:'Alasan pembatalan harus diisi' });
        return;
    }

    const res = await fetch('/transaksi/cancel', { 
        method:'POST', 
        headers:{'Content-Type':'application/json'}, 
        body:JSON.stringify({
            id: id,
            action_type: formValues.action_type,
            cancel_reason: formValues.cancel_reason
        }) 
    });
    const result = await res.json();
    if (result.success) { 
        Swal.fire({ icon:'success', title:'Berhasil', text:result.message, timer:1500, showConfirmButton:false }); 
        loadTransaksi(); 
    } else {
        Swal.fire({ icon:'error', title:'Gagal', text:result.message });
    }
  }

  async function printReceipt(noTiket) {
    window.open(`/print-ticket/${noTiket}`, '_blank', 'width=800,height=600');
  }

  function exportExcel() {
    const filter = document.getElementById('dateFilterSelect').value;
    const start = document.getElementById('startDateInput').value;
    const end = document.getElementById('endDateInput').value;
    let url = `/transaksi/export-excel?date_filter=${filter}`;
    if (filter==='custom_range'&&start&&end) url+=`&start_date=${start}&end_date=${end}`;
    window.location.href = url;
  }

  async function sendReportEmail(reportType) {
    const { value: email } = await Swal.fire({
      title: '📧 Kirim Laporan ke Email',
      html: `<input id="swalEmailInput" class="swal2-input" placeholder="email_tujuan@gmail.com" type="email">
             <select id="swalReportType" class="swal2-select" style="margin-top:10px;">
               <option value="semua">Semua Laporan</option>
               <option value="transaksi">Laporan Transaksi Timbangan</option>
               <option value="keuangan">Laporan Keuangan / Kas</option>
               <option value="pengiriman">Laporan Pengiriman Pabrik</option>
             </select>`,
      focusConfirm: false,
      showCancelButton: true,
      confirmButtonText: 'Kirim',
      confirmButtonColor: '#059669',
      cancelButtonText: 'Batal',
      preConfirm: () => {
        const emailVal = document.getElementById('swalEmailInput').value.trim();
        if (!emailVal) { Swal.showValidationMessage('Masukkan alamat email tujuan'); return false; }
        return {
          email: emailVal,
          type: document.getElementById('swalReportType').value
        };
      }
    });
    if (!email) return;

    Swal.fire({ title: 'Mengirim laporan...', text: 'Mohon tunggu sebentar', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

    const filter = document.getElementById('dateFilterSelect').value;
    const start = document.getElementById('startDateInput').value;
    const end = document.getElementById('endDateInput').value;

    try {
      const res = await fetch('/setup/send-report-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          recipient: email.email,
          report_type: email.type,
          date_filter: filter,
          start_date: start,
          end_date: end
        })
      });
      const r = await res.json();
      if (r.success) {
        Swal.fire({ icon: 'success', title: 'Terkirim!', text: r.message, timer: 3000, showConfirmButton: true });
      } else {
        Swal.fire({ icon: 'error', title: 'Gagal', text: r.message });
      }
    } catch (e) {
      Swal.fire({ icon: 'error', title: 'Error', text: 'Gagal mengirim: ' + e.message });
    }
  }

  document.addEventListener('DOMContentLoaded', async function() {
    await loadSessionInfo();
    await loadTransaksi();
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('startDateInput').value = today;
    document.getElementById('endDateInput').value = today;
  });
  </script>
  <script src="/js/sidebar.js"></script>
</body>
