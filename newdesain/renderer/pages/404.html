<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>404 - Halaman Tidak Ditemukan</title>
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
  <style>
    body { 
      background: #f4f4f0; 
      color: #000000; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      font-family: 'Inter', Arial, sans-serif; 
      font-weight: 800;
      margin: 0;
    }
    .error-box { 
      text-align: center; 
      background: #ffffff;
      border: 4px solid #000000;
      padding: 40px 60px;
      box-shadow: 6px 6px 0px 0px rgba(0,0,0,1);
    }
    .error-code { 
      font-size: 8rem; 
      font-weight: 900; 
      color: #ff007f; /* Neo Pink */
      line-height: 1; 
      margin-bottom: 20px;
      text-shadow: 2px 2px 0px #000000;
    }
    h2 { 
      font-size: 1.8rem; 
      margin-top: 1rem; 
      text-transform: uppercase;
      font-weight: 900;
    }
    p {
      margin-top: 20px;
    }
    a { 
      color: #000000; 
      background: #ffe600; /* Neo Yellow */
      border: 2px solid #000000;
      padding: 10px 20px;
      text-decoration: none; 
      box-shadow: 2px 2px 0px 0px rgba(0,0,0,1);
      display: inline-block;
      transition: all 0.07s ease;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 800;
    }
    a:hover { 
      text-decoration: none; 
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px 0px rgba(0,0,0,1);
      background: #ffeb33;
    }
  </style>
</head>
<body>
  <div class="error-box">
    <div class="error-code">404</div>
    <h2>Halaman tidak ditemukan</h2>
    <p><a href="/timbangan/1">← Kembali ke Timbangan 1</a></p>
  </div>
</body>
</html>
