<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aktivasi Aplikasi - Weighbridge Arroyan</title>
  <link href="/assets/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/css/sweetalert2.min.css" rel="stylesheet">
  <link href="/assets/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f4f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      font-family: 'Inter', Arial, sans-serif;
      font-weight: 800;
    }
    .activation-card {
      max-width: 500px;
      width: 100%;
      background: #ffffff;
      border: 4px solid #000000 !important;
      border-radius: 0px !important;
      box-shadow: 6px 6px 0px 0px rgba(0,0,0,1);
    }
    .card-header {
      background-color: #ff007f !important; /* Neo Pink */
      color: white !important;
      text-align: center;
      font-weight: 900;
      border-bottom: 4px solid #000000 !important;
      border-top-left-radius: 0px !important;
      border-top-right-radius: 0px !important;
      padding: 20px !important;
      text-transform: uppercase;
      font-size: 16px;
      letter-spacing: 0.5px;
    }
    .hwid-box {
      background-color: #f4f4f0 !important;
      padding: 10px;
      border: 2px solid #000000 !important;
      border-radius: 0px !important;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      word-break: break-all;
      color: #000000 !important;
      font-weight: 800;
    }
    .form-control {
      border: 2px solid #000000 !important;
      border-radius: 0px !important;
      font-weight: 700;
    }
    .form-control:focus {
      background-color: #ffe600 !important; /* Neo Yellow focus */
      border-color: #000000 !important;
      color: #000000 !important;
      box-shadow: none !important;
      outline: none !important;
    }
    .btn-salin {
      background-color: #ffe600 !important; /* Neo Yellow */
      color: #000000 !important;
      border: 2px solid #000000 !important;
      border-radius: 0px !important;
      font-weight: 800;
      box-shadow: 2px 2px 0px 0px rgba(0,0,0,1);
      transition: all 0.07s ease;
    }
    .btn-salin:hover {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px 0px rgba(0,0,0,1);
    }
    .btn-aktivasi {
      background-color: #00ff66 !important; /* Neo Green */
      color: #000000 !important;
      border: 2px solid #000000 !important;
      border-radius: 0px !important;
      font-weight: 900;
      box-shadow: 3px 3px 0px 0px rgba(0,0,0,1);
      transition: all 0.07s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-aktivasi:hover {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0px 0px rgba(0,0,0,1);
      background-color: #33ff85 !important;
    }
    .card-footer {
      background: #f4f4f0 !important;
      border-top: 2px solid #000000 !important;
      border-radius: 0px !important;
      padding: 10px !important;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      color: #000000 !important;
    }
  </style>
</head>
<body>

  <div class="card activation-card">
    <div class="card-header">
      <i class="bi bi-lock-fill" style="font-size: 24px;"></i><br>
      APLIKASI TERKUNCI (AKTIVASI DIBUTUHKAN)
    </div>
    <div class="card-body p-4">
      <p class="text-center text-black mb-4">Aplikasi ini belum diaktivasi atau lisensi tidak valid untuk komputer ini.</p>
      
      <div class="mb-3">
        <label class="form-label fw-bold text-black uppercase tracking-wider block mb-2" style="font-size: 12px;">1. Hardware ID Anda:</label>
        <div class="input-group">
          <input type="text" class="form-control hwid-box" id="hwidDisplay" readonly value="Memuat...">
          <button class="btn btn-salin" onclick="copyHwid()" title="Salin Hardware ID">
            <i class="bi bi-clipboard"></i> Salin
          </button>
        </div>
        <small class="text-black font-extrabold d-block mt-2" style="font-size: 11px;">Kirimkan Hardware ID ini ke Arroyan Jv Teknik untuk mendapatkan Kunci Lisensi.</small>
      </div>

      <hr class="my-4" style="border-top: 2px solid #000000; opacity: 1;">

      <form id="activationForm">
        <div class="mb-3">
          <label class="form-label fw-bold text-black uppercase tracking-wider block mb-2" style="font-size: 12px;">2. Masukkan Kunci Lisensi:</label>
          <textarea class="form-control" id="licenseKey" rows="4" required placeholder="Paste lisensi dari Arroyan Jv Teknik di sini..."></textarea>
        </div>
        <button type="submit" class="btn btn-aktivasi w-100 py-3 mt-2">
          <i class="bi bi-key-fill"></i> Aktivasi Sekarang
        </button>
      </form>
    </div>
    <div class="card-footer text-center">
      &copy; 2024 Arroyan Jv Teknik
    </div>
  </div>

  <script src="/assets/js/jquery-3.7.1.min.js"></script>
  <script src="/assets/js/sweetalert2.min.js"></script>
  <script>
    // Fetch HWID on load
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/license/hwid');
        const data = await res.json();
        if (data.success) {
          document.getElementById('hwidDisplay').value = data.hwid;
        } else {
          document.getElementById('hwidDisplay').value = 'Gagal memuat HWID';
        }
      } catch (error) {
        document.getElementById('hwidDisplay').value = 'Koneksi error';
      }
    });

    function copyHwid() {
      const hwid = document.getElementById('hwidDisplay');
      hwid.select();
      document.execCommand('copy');
      Swal.fire({
        icon: 'success',
        title: 'Disalin!',
        text: 'Hardware ID berhasil disalin ke clipboard.',
        toast: true,
        position: 'top-end',
        timer: 2000,
        showConfirmButton: false
      });
    }

    document.getElementById('activationForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const key = document.getElementById('licenseKey').value;
      if (!key.trim()) return;

      try {
        const res = await fetch('/license/activate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ license_key: key.trim() })
        });
        const r = await res.json();
        if (r.success) {
          Swal.fire({
            icon: 'success',
            title: 'Aktivasi Berhasil!',
            text: 'Aplikasi Anda sekarang dapat digunakan.',
            confirmButtonText: 'Masuk Aplikasi'
          }).then(() => {
            window.location.href = '/';
          });
        } else {
          Swal.fire({
            icon: 'error',
            title: 'Aktivasi Gagal',
            text: r.message
          });
        }
      } catch (error) {
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: 'Gagal terhubung ke server.'
        });
      }
    });
  </script>
</body>
</html>
