<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timbangan 1 - Weighbridge Arroyan</title>
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/sweetalert2.min.css">
  <link rel="stylesheet" href="/assets/css/bw-theme.css">
  <link rel="stylesheet" href="/assets/css/tailwind.min.css">
</head>

<body class="bg-neoBg font-bold">
  <!-- Header -->
  <div id="site-header"></div>

  <div class="container-fluid vh-100 py-2 d-flex flex-column" style="max-height: 100vh; overflow: hidden;">
    <div
      class="card border-4 border-black bg-white text-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] rounded-none flex-grow d-flex flex-column overflow-hidden">
      <!-- Card Header (Compact) -->
      <div class="card-header bg-neoYellow border-b-4 border-black py-2 rounded-none flex-shrink-0">
        <div class="d-flex align-items-center justify-content-between">
          <div>
            <h5 class="mb-0 text-black font-black uppercase tracking-wider"> TIMBANGAN
              1 (BRUTO)</h5>
          </div>
          <div class="text-end d-flex align-items-center gap-2">
            <span
              class="badge bg-red-600 text-white border-2 border-black rounded-none shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] font-extrabold px-3 py-2 text-xs">
              PORT: <span id="currentBaudRate">9600</span> bps
            </span>
            <button
              class="btn bg-white hover:bg-neoBg text-black border-2 border-black rounded-none shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] font-black py-1 px-3 text-xs"
              id="openSerialSettings" tabindex="-1">
              PENGATURAN
            </button>
          </div>
        </div>
      </div>

      <!-- Card Body (No scroll on outer body, flex layout) -->
      <div class="card-body p-3 flex-grow d-flex flex-column justify-content-between overflow-hidden bg-white">
        <div id="alertContainer" class="flex-shrink-0 mb-1"></div>

        <form method="POST" id="timbangan1Form"
          class="flex-grow d-flex flex-column justify-content-between overflow-hidden">
          <!-- DISPLAY PANEL BANNER (TOP) -->
          <div class="card border-4 border-black bg-white rounded-none p-1.5 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex-shrink-0 mb-3">
            <div class="row g-0 align-items-center">
              
              <!-- Wide Scale Display -->
              <div class="col-md-7">
                <div class="scale-display-panel d-flex flex-row justify-content-between align-items-center py-2 px-4 m-1" style="min-height: 80px;">
                  <div class="d-flex align-items-baseline gap-3">
                    <div class="scale-weight-value m-0" id="weightDisplay" style="font-size: clamp(40px, 5vw, 60px); line-height: 1;">0</div>
                    <div class="scale-weight-unit m-0" style="font-size: 20px;">KG</div>
                  </div>
                  <div class="scale-status-dot disconnected m-0" id="connectionBadge">
                    <span class="pulse-dot"></span>
                    <span id="weightStatus">TERPUTUS</span>
                  </div>
                </div>
              </div>

              <!-- Actions -->
              <div class="col-md-5 px-2 d-flex align-items-center">
                <div class="row g-2 w-100">
                  <div class="col-6">
                    <button type="button"
                      class="btn w-100 bg-neoBlue hover:bg-[#3385ff] text-white font-black py-3 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] text-sm"
                      id="toggleConnection" tabindex="-1">
                      SAMBUNG
                    </button>
                  </div>
                  <div class="col-6">
                    <button type="button"
                      class="btn w-100 bg-neoYellow hover:bg-[#ffeb33] text-black font-black py-3 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] text-sm"
                      id="captureWeight" tabindex="7">
                      AMBIL BERAT
                    </button>
                  </div>
                </div>
              </div>

            </div>
          </div>

          <div class="row g-3 flex-grow overflow-hidden">
            <!-- Left Side: Form Fields (Now col-12) -->
            <div class="col-12 d-flex flex-column justify-content-between overflow-hidden">
              <div class="row g-2">
                <!-- Mode Timbangan & Langsir (Side-by-side in one compact row) -->
                <div class="col-md-7">
                  <div
                    class="bg-neoBg border-2 border-black p-2 rounded-none shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] h-100 d-flex flex-column justify-center">
                    <label class="form-label text-black font-black uppercase tracking-wider mb-1 block">Mode
                      Timbangan</label>
                    <div class="d-flex gap-3 align-items-center">
                      <div class="form-check mb-0">
                        <input class="form-check-input border-2 border-black rounded-none accent-black" type="radio"
                          name="mode_timbangan" id="modeBeli" value="beli" checked
                          style="transform: scale(1.1); cursor: pointer;">
                        <label
                          class="form-check-label ms-1 font-black uppercase tracking-wider text-xs cursor-pointer text-black"
                          for="modeBeli">
                          BELI
                        </label>
                      </div>
                      <div class="form-check mb-0">
                        <input class="form-check-input border-2 border-black rounded-none accent-black" type="radio"
                          name="mode_timbangan" id="modeJual" value="jual"
                          style="transform: scale(1.1); cursor: pointer;">
                        <label
                          class="form-check-label ms-1 font-black uppercase tracking-wider text-xs cursor-pointer text-black"
                          for="modeJual">
                          JUAL
                        </label>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="col-md-5">
                  <div
                    class="bg-neoBg border-2 border-black p-2 rounded-none shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] h-100 d-flex flex-column justify-center"
                    id="field_langsir">
                    <div class="form-check form-switch mb-0">
                      <input class="form-check-input border-2 border-black rounded-none accent-black" type="checkbox"
                        name="is_langsir" id="isLangsir" value="1" style="transform: scale(1.1); cursor: pointer;">
                      <label
                        class="form-check-label ms-1 font-black uppercase tracking-wider text-xs cursor-pointer text-black"
                        for="isLangsir">
                        LANGSIR
                      </label>
                    </div>
                  </div>
                </div>

                <div class="col-12" id="langsirInfoContainer">
                  <div id="langsirInfo"
                    class="alert alert-info py-1 px-2 mb-0 small font-black border-2 border-black rounded-none bg-white text-black"
                    style="display:none; font-size: 11px;"></div>
                </div>

                <!-- Form Fields Grid (Compact, 2 Columns) -->
                <div class="col-md-6" id="field_no_kendaraan">
                  <label class="form-label text-black font-black uppercase tracking-wider block">No. Kendaraan</label>
                  <input type="text" name="no_kendaraan" id="noKendaraanInput"
                    class="form-control font-bold focus:bg-neoYellow outline-none py-1.5"
                    style="text-transform:uppercase;" required tabindex="1">
                </div>
                <div class="col-md-6" id="field_nama_pengemudi">
                  <label class="form-label text-black font-black uppercase tracking-wider block">Nama Pengemudi</label>
                  <input type="text" name="nama_pengemudi" id="namaPengemudiInput"
                    class="form-control font-bold focus:bg-neoYellow outline-none py-1.5"
                    style="text-transform:uppercase;" required tabindex="2">
                  <div id="supirHutangWarning"
                    class="alert alert-warning py-1 px-2 mt-1 mb-0 small font-black border-2 border-black rounded-none bg-neoYellow text-black"
                    style="display:none; font-size: 10px;"></div>
                </div>
                <div class="col-md-6" id="field_nama_suplier">
                  <label class="form-label text-black font-black uppercase tracking-wider block">Nama Supplier</label>
                  <input type="text" name="nama_suplier" id="supplierInput"
                    class="form-control font-bold focus:bg-neoYellow outline-none py-1.5"
                    style="text-transform:uppercase;" list="supplierList" autocomplete="off" required tabindex="3">
                  <datalist id="supplierList"></datalist>
                  <div id="supplierValidationText"
                    class="alert alert-warning py-1 px-2 mt-1 mb-0 small font-black border-2 border-black rounded-none bg-neoYellow text-black"
                    style="display:none; font-size: 10px;"></div>
                </div>
                <div class="col-md-6" id="field_material">
                  <label class="form-label text-black font-black uppercase tracking-wider block">Jenis Material</label>
                  <select id="materialSelect" class="form-select font-bold focus:bg-neoYellow outline-none py-1.5" tabindex="4">
                    <!-- populated dynamically -->
                  </select>
                  <div class="mt-1">
                    <input type="text" id="newMaterialInput"
                      class="form-control font-bold focus:bg-neoYellow outline-none py-1"
                      placeholder="+ Material Baru..." style="text-transform:uppercase; font-size: 11px;"
                      autocomplete="off">
                  </div>
                </div>

                <!-- BERAT TERTANGKAP (Besar & Di bawah Jenis Material) -->
                <div class="col-12 my-1" id="field_berat_tertangkap">
                  <div class="card border-2 border-black rounded-none bg-neoPink text-white p-2 shadow-[3px_3px_0px_0px_rgba(0,0,0,1)]">
                    <div class="d-flex align-items-center justify-content-between gap-3">
                      <label class="text-white font-black uppercase tracking-wider mb-0 text-sm flex-shrink-0">
                        BERAT TERTANGKAP (KG)
                      </label>
                      <input type="number"
                        class="form-control text-center font-black focus:bg-neoYellow text-black bg-white outline-none py-1 border-2 border-black flex-grow-1"
                        name="berat" id="beratInputForm" value="" step="1" min="0" placeholder="0" required tabindex="-1" style="font-size: 1.75rem; height: 48px; max-width: 250px;">
                    </div>
                  </div>
                </div>

                <div class="col-md-6" id="field_harga">
                  <label class="form-label text-black font-black uppercase tracking-wider block">Harga per Kg</label>
                  <input type="text" name="harga_display"
                    class="form-control font-bold focus:bg-neoYellow outline-none py-1.5" id="hargaInput"
                    placeholder="Rp 0" tabindex="5">
                  <input type="hidden" name="harga" id="hargaHidden" value="0">
                </div>
                <div class="col-md-6" id="field_keterangan">
                  <label class="form-label text-black font-black uppercase tracking-wider block">Keterangan</label>
                  <input type="text" class="form-control font-bold focus:bg-neoYellow outline-none py-1.5"
                    name="keterangan" style="text-transform:uppercase;" tabindex="6">
                </div>
              </div>

              <!-- Main Submission Buttons -->
              <div class="row g-2 mt-3">
                <div class="col-8">
                  <button type="submit"
                    class="btn w-100 bg-neoGreen hover:bg-[#33ff85] text-black font-black py-2.5 shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] d-flex align-items-center justify-content-center gap-1"
                    id="btnSimpan" tabindex="8">
                    <span id="btnSimpanText">SIMPAN DATA</span>
                  </button>
                </div>
                <div class="col-4">
                  <button type="reset"
                    class="btn w-100 bg-white hover:bg-neoBg text-black font-black py-2.5 shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] d-flex align-items-center justify-content-center gap-1"
                    id="btnReset" tabindex="-1">
                    RESET
                  </button>
                </div>
              </div>
            </div></div>

          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Serial Settings Modal -->
  <div class="modal fade" id="serialSettingsModal" tabindex="-1">
    <div class="modal-dialog">
      <div
        class="modal-content bg-white text-black border-4 border-black rounded-none shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
        <div class="modal-header bg-neoYellow border-b-4 border-black rounded-none">
          <h5 class="modal-title font-black uppercase text-black">Pengaturan Port Serial
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <div class="mb-4">
            <label class="form-label text-black font-black uppercase tracking-wider block mb-2">Baud Rate</label>
            <select class="form-select border-2 border-black rounded-none p-3 font-bold focus:bg-neoYellow outline-none"
              id="baudRateSelect">
              <option value="1200">1200</option>
              <option value="2400">2400</option>
              <option value="4800">4800</option>
              <option value="9600" selected>9600</option>
              <option value="19200">19200</option>
              <option value="38400">38400</option>
              <option value="57600">57600</option>
              <option value="115200">115200</option>
            </select>
          </div>
          <div id="portInfo"
            class="alert alert-info py-2 px-3 small font-black border-2 border-black rounded-none bg-neoBg text-black">
          </div>
        </div>
        <div class="modal-footer border-t-2 border-black bg-neoBg rounded-none">
          <button
            class="btn bg-white hover:bg-neoBg text-black font-black border-2 border-black py-2 px-4 rounded-none shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]"
            data-bs-dismiss="modal">Tutup</button>
          <button
            class="btn bg-neoGreen hover:bg-[#33ff85] text-black font-black border-2 border-black py-2 px-4 rounded-none shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]"
            id="saveBaudRate">Simpan</button>
          <button
            class="btn bg-neoPink hover:bg-[#ff3399] text-white font-black border-2 border-black py-2 px-4 rounded-none shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]"
            id="forgetPort">Lupakan Port</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/assets/js/jquery-3.7.1.min.js"></script>
  <script src="/assets/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/sweetalert2.min.js"></script>
  <script src="/js/auto-serial-connect.js" defer></script>

  <script>
    // ─── Session Info ──────────────────────────────────────────────────────────
    window.activePage = 'timbangan1';
    let allSuppliers = [];

    async function loadSuppliers() {
      try {
        const res = await fetch('/timbangan/data?_t=' + Date.now());
        const data = await res.json();
        if (data.success) {
          allSuppliers = data.data.suppliers || [];
          const dl = document.getElementById('supplierList');
          if (dl) {
            dl.innerHTML = '';
            allSuppliers.forEach(s => {
              const opt = document.createElement('option');
              opt.value = s.nama_supplier;
              dl.appendChild(opt);
            });
          }
          // Populate material options into select
          const sel = document.getElementById('materialSelect');
          if (sel) {
            sel.innerHTML = '';
            let materialsList = data.data.materials || ['tbs', 'brondolan'];
            if (typeof materialsList === 'string') {
              try { materialsList = JSON.parse(materialsList); } catch (e) { }
            }
            if (!Array.isArray(materialsList)) materialsList = ['tbs', 'brondolan'];
            materialsList.forEach(m => {
              const opt = document.createElement('option');
              opt.value = m.toLowerCase();
              opt.textContent = m.toUpperCase();
              sel.appendChild(opt);
            });
          }

          // Default material to tbs if currently empty
          const selEl = document.getElementById('materialSelect');
          if (selEl && !selEl.value) {
            selEl.value = 'tbs';
          }
        }
      } catch (e) { console.warn('Load suppliers error:', e); }
    }

    // ─── Load Drivers for datalist & Check Debt ──────────────────────────────
    async function loadDrivers() {
      // Autocomplete dropdown suggestions disabled by request
    }

    // ─── Load Field Settings (Custom fields per RAM) ────────────────────────────
    let isHutangActive = false;
    async function loadFieldSettings() {
      try {
        const res = await fetch('/setup/settings');
        const r = await res.json();
        if (r.success) {
          if (r.data.active_features) {
            try {
              const features = JSON.parse(r.data.active_features);
              isHutangActive = features.hutang === true;
            } catch (e) { }
          }

          if (r.data.timbangan1_fields) {
            const fields = JSON.parse(r.data.timbangan1_fields);
            window.t1Fields = fields;
            const fieldMap = {
              no_kendaraan: 'field_no_kendaraan',
              nama_pengemudi: 'field_nama_pengemudi',
              nama_suplier: 'field_nama_suplier',
              material: 'field_material',
              harga: 'field_harga',
              keterangan: 'field_keterangan'
            };
            Object.keys(fieldMap).forEach(key => {
              const el = document.getElementById(fieldMap[key]);
              if (!el) return;
              if (fields[key] === false) {
                el.style.display = 'none';
                // Remove required & clear value from hidden inputs
                el.querySelectorAll('input, select, textarea').forEach(inp => {
                  inp.removeAttribute('required');
                  if (inp.type !== 'hidden') inp.value = '';
                });
              } else {
                // Restore visible
                el.style.display = '';
              }
            });
          }
        }
      } catch (e) { console.warn('Load field settings error:', e); }
    }

    // ─── Check Driver Debt on Input ──────────────────────────────────────────
    let hutangTimeout = null;
    document.getElementById('namaPengemudiInput').addEventListener('input', function () {
      if (!isHutangActive) return;
      const name = this.value.trim();
      const warningEl = document.getElementById('supirHutangWarning');
      if (!name) {
        warningEl.style.display = 'none';
        return;
      }
      clearTimeout(hutangTimeout);
      hutangTimeout = setTimeout(async () => {
        try {
          const res = await fetch('/hutang-supir-api/supir/check-debt?name=' + encodeURIComponent(name));
          const data = await res.json();
          if (data.success && data.data && data.data.total_hutang > 0) {
            warningEl.textContent = `⚠️ Supir ini memiliki sisa hutang: ${new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(data.data.total_hutang)}`;
            warningEl.style.display = 'block';
          } else {
            warningEl.style.display = 'none';
          }
        } catch (e) {
          warningEl.style.display = 'none';
        }
      }, 400);
    });

    // ─── Check Ongoing Langsir Trip ───────────────────────────────────────────
    let pendingLangsirTxId = null;
    let pendingTripCount = 0;

    function checkOngoingLangsir() {
      const plate = document.getElementById('noKendaraanInput').value.trim().toUpperCase();
      const supir = document.getElementById('namaPengemudiInput').value.trim().toUpperCase();
      const supplier = document.getElementById('supplierInput').value.trim().toUpperCase();

      if (!plate && !supir && !supplier) {
        resetLangsirUI();
        return;
      }

      fetch('/timbangan/ajax', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'get_pending_tickets' })
      }).then(r => r.json()).then(res => {
        if (res.success && res.data) {
          const activeTx = res.data.find(t => {
            if (t.is_langsir !== 1) return false;
            const matchPlate = plate && t.no_polisi && t.no_polisi.toUpperCase() === plate;
            const matchSupir = supir && t.nama_supir && t.nama_supir.toUpperCase() === supir;
            const matchSupplier = supplier && t.nama_supplier && t.nama_supplier.toUpperCase() === supplier;
            return matchPlate || matchSupir || matchSupplier;
          });

          if (activeTx) {
            pendingLangsirTxId = activeTx.id;
            pendingTripCount = activeTx.jumlah_trip_langsir || 1;

            document.getElementById('isLangsir').checked = true;
            document.getElementById('isLangsir').disabled = true;

            // Fill other fields if currently empty
            if (!document.getElementById('noKendaraanInput').value.trim() && activeTx.no_polisi) {
              document.getElementById('noKendaraanInput').value = activeTx.no_polisi;
            }
            if (!document.getElementById('namaPengemudiInput').value.trim() && activeTx.nama_supir) {
              document.getElementById('namaPengemudiInput').value = activeTx.nama_supir;
            }
            if (!document.getElementById('supplierInput').value.trim() && activeTx.nama_supplier) {
              document.getElementById('supplierInput').value = activeTx.nama_supplier;
            }

            const info = document.getElementById('langsirInfo');
            info.innerHTML = `Trip ke-${pendingTripCount + 1} ${activeTx.nama_supir || ''}`;
            info.style.display = 'block';

            document.getElementById('btnSimpanText').textContent = 'TAMBAH TRIP LANGSIR';
          } else {
            resetLangsirUI();
          }
        }
      }).catch(e => console.error(e));
    }

    document.getElementById('noKendaraanInput').addEventListener('input', checkOngoingLangsir);
    document.getElementById('namaPengemudiInput').addEventListener('input', checkOngoingLangsir);
    document.getElementById('supplierInput').addEventListener('input', checkOngoingLangsir);

    function resetLangsirUI() {
      pendingLangsirTxId = null;
      pendingTripCount = 0;
      document.getElementById('isLangsir').disabled = false;
      document.getElementById('langsirInfo').style.display = 'none';
      document.getElementById('btnSimpanText').textContent = 'SIMPAN DATA';
    }

    document.getElementById('supplierInput').addEventListener('input', function () {
      const val = this.value.trim().toUpperCase();
      const validationEl = document.getElementById('supplierValidationText');
      const hargaInput = document.getElementById('hargaInput');
      const hargaHidden = document.getElementById('hargaHidden');
      const fieldHarga = document.getElementById('field_harga');

      if (!val) {
        validationEl.style.display = 'none';
        if (fieldHarga) fieldHarga.style.display = (window.t1Fields && window.t1Fields.harga === false) ? 'none' : '';
        return;
      }

      const matchedSupplier = allSuppliers.find(s => s.nama_supplier.toUpperCase() === val);
      if (matchedSupplier) {
        // Auto-fill price
        const price = matchedSupplier.default_harga || 0;
        hargaHidden.value = price;
        hargaInput.value = new Intl.NumberFormat('id-ID').format(price);

        // Display validation info (small green text, or red if has debt)
        let infoText = `Harga = Rp ${new Intl.NumberFormat('id-ID').format(price)} | Potongan = ${matchedSupplier.default_potongan || 0}%`;
        if (matchedSupplier.total_hutang && parseFloat(matchedSupplier.total_hutang) > 0) {
          infoText += ` | ⚠️ Sisa Hutang: Rp ${new Intl.NumberFormat('id-ID').format(matchedSupplier.total_hutang)}`;
          validationEl.className = 'small mt-1 font-black border-2 border-black rounded-none p-1 bg-neoBg text-danger';
        } else {
          validationEl.className = 'small mt-1 font-black border-2 border-black rounded-none p-1 bg-neoBg text-black';
        }
        validationEl.textContent = infoText;
        validationEl.style.display = 'block';
        if (fieldHarga) fieldHarga.style.display = '';
      } else {
        // Unregistered supplier -> do nothing (hide validation element)
        validationEl.style.display = 'none';
        if (fieldHarga) fieldHarga.style.display = (window.t1Fields && window.t1Fields.harga === false) ? 'none' : '';
      }
    });

    // ─── Form Submit ───────────────────────────────────────────────────────────
    let isWeightLocked = false;

    document.getElementById('timbangan1Form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = document.getElementById('btnSimpan');
      btn.disabled = true;
      const btnText = document.getElementById('btnSimpanText');
      if (btnText) btnText.textContent = 'Menyimpan...';
      else btn.innerHTML = '<span id="btnSimpanText">Menyimpan...</span>';

      try {
        const formData = new FormData(this);
        const selectVal = document.getElementById('materialSelect').value;
        const newMatVal = document.getElementById('newMaterialInput').value.trim().toLowerCase();
        const materialVal = newMatVal ? newMatVal : selectVal;

        const payload = {
          no_kendaraan: formData.get('no_kendaraan'),
          nama_pengemudi: formData.get('nama_pengemudi'),
          nama_suplier: formData.get('nama_suplier'),
          material: materialVal,
          harga: formData.get('harga') || '0',
          berat: formData.get('berat'),
          keterangan: formData.get('keterangan') || '',
          mode_timbangan: document.querySelector('input[name="mode_timbangan"]:checked')?.value || 'beli'
        };

        if (pendingLangsirTxId) {
          payload.action = 'append_langsir_trip';
          payload.id_transaksi = pendingLangsirTxId;
          payload.berat_timbangan1 = payload.berat;

          const res = await fetch('/timbangan/ajax', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const result = await res.json();
          handleSaveResponse(result);
        } else {
          payload.is_langsir = document.getElementById('isLangsir').checked ? 1 : 0;
          const res = await fetch('/timbangan/save-timbangan1', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const result = await res.json();
          handleSaveResponse(result);
        }

        function handleSaveResponse(result) {
          if (result.success) {
            Swal.fire({
              icon: 'success',
              title: 'Berhasil!',
              text: result.message,
              timer: 2000,
              showConfirmButton: false
            }).then(() => {
              document.getElementById('timbangan1Form').reset();
              document.getElementById('newMaterialInput').value = '';
              loadSuppliers(); // Reload lists to include the newly added material in the dropdown
              document.getElementById('weightDisplay').textContent = '0 KG';
              isWeightLocked = false;
              window.isWeightLocked = false;
              document.getElementById('supirHutangWarning').style.display = 'none';
              document.getElementById('supplierValidationText').style.display = 'none';
              resetLangsirUI();
            });
          } else {
            Swal.fire({ icon: 'error', title: 'Gagal', text: result.message });
          }
        }
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Error', text: 'Gagal menyimpan data' });
      } finally {
        btn.disabled = false;
        const btnText = document.getElementById('btnSimpanText');
        if (btnText) btnText.textContent = 'SIMPAN DATA';
        else btn.innerHTML = '<span id="btnSimpanText">SIMPAN DATA</span>';
      }
    });

    // ─── Rupiah Formatting ─────────────────────────────────────────────────────
    document.getElementById('hargaInput').addEventListener('input', function () {
      const val = this.value.replace(/[^0-9]/g, '');
      document.getElementById('hargaHidden').value = val;
      if (val) this.value = new Intl.NumberFormat('id-ID').format(parseInt(val));
    });

    // ─── Capture Weight ────────────────────────────────────────────────────────
    document.getElementById('captureWeight').addEventListener('click', function () {
      const display = document.getElementById('weightDisplay');
      const weight = parseInt(display.dataset.rawWeight) || 0;
      if (weight > 0) {
        document.getElementById('beratInputForm').value = weight;
        isWeightLocked = true;
        window.isWeightLocked = true;
        this.innerHTML = 'TERKUNCI';
        this.className = 'btn w-100 bg-neoGreen hover:bg-[#33ff85] text-black font-black py-2.5 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]';
      } else {
        Swal.fire({ icon: 'warning', title: 'Perhatian', text: 'Belum ada berat dari timbangan' });
      }
    });

    // Reset unlock
    document.getElementById('btnReset').addEventListener('click', function () {
      isWeightLocked = false;
      window.isWeightLocked = false;
      document.getElementById('captureWeight').innerHTML = 'AMBIL BERAT';
      document.getElementById('captureWeight').className = 'btn w-100 bg-neoYellow hover:bg-[#ffeb33] text-black font-black py-2.5 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]';
      document.getElementById('weightDisplay').textContent = '0';
      document.getElementById('supirHutangWarning').style.display = 'none';
      document.getElementById('supplierValidationText').style.display = 'none';
      document.getElementById('isLangsir').checked = false;
      resetLangsirUI();
    });

    // ─── Serial Settings Modal ─────────────────────────────────────────────────
    document.getElementById('openSerialSettings').addEventListener('click', function () {
      const modal = new bootstrap.Modal(document.getElementById('serialSettingsModal'));
      const saved = localStorage.getItem('serialBaudRate');
      if (saved) document.getElementById('baudRateSelect').value = saved;
      modal.show();
    });

    document.getElementById('saveBaudRate').addEventListener('click', function () {
      const baud = parseInt(document.getElementById('baudRateSelect').value);
      localStorage.setItem('serialBaudRate', baud);
      document.getElementById('currentBaudRate').textContent = baud;
      if (window.serialConnector) window.serialConnector.updateBaudRate(baud);
      bootstrap.Modal.getInstance(document.getElementById('serialSettingsModal')).hide();
      Swal.fire({ icon: 'success', title: 'Tersimpan', text: `Baud rate: ${baud}`, timer: 1500, showConfirmButton: false });
    });

    document.getElementById('forgetPort').addEventListener('click', async function () {
      if (window.serialConnector) await window.serialConnector.forgetPort();
      Swal.fire({ icon: 'info', title: 'Port Dilupakan', text: 'Pilih port baru dengan klik SAMBUNGKAN', timer: 2000, showConfirmButton: false });
    });

    // ─── Init ─────────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async function () {
      await loadSessionInfo();
      await loadSuppliers();
      await loadDrivers();
      await loadFieldSettings();

      // Init baud rate display
      const savedBaud = localStorage.getItem('serialBaudRate') || '9600';
      document.getElementById('currentBaudRate').textContent = savedBaud;

      // Auto-init Serial Connector (from auto-serial-connect.js)
      // Will be initialized after script loads
      setTimeout(initSerialConnector, 500);

      // ── Auto-focus: Fokus ke field pertama yang terlihat ──
      setTimeout(() => {
        const tabFields = [
          'noKendaraanInput',
          'namaPengemudiInput',
          'supplierInput',
          'materialSelect',
          'hargaInput'
        ];
        for (const id of tabFields) {
          const el = document.getElementById(id);
          if (el && el.offsetParent !== null) { // visible check
            el.focus();
            break;
          }
        }
      }, 300);

      // ── Skip hidden fields in tab order ──
      // After loadFieldSettings, set tabindex=-1 on inputs inside hidden field containers
      const fieldContainers = document.querySelectorAll('[id^="field_"]');
      fieldContainers.forEach(container => {
        if (container.style.display === 'none') {
          container.querySelectorAll('input, select, textarea').forEach(inp => {
            inp.setAttribute('tabindex', '-1');
          });
        }
      });

      // ── Enter key: Submit form dari input manapun ──
      const form = document.getElementById('timbangan1Form');
      form.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          const tag = e.target.tagName.toLowerCase();
          // Jangan submit jika sedang di textarea atau select (biarkan default behavior)
          if (tag === 'textarea') return;
          // Jika di select, biarkan Enter memilih option
          if (tag === 'select') return;
          // Jika di input, cegah default dan submit form
          if (tag === 'input' || tag === 'button') {
            e.preventDefault();
            // Klik tombol Simpan
            document.getElementById('btnSimpan').click();
          }
        }
      });
    });

    async function initSerialConnector() {
      if (typeof AutoSerialConnector === 'undefined') {
        setTimeout(initSerialConnector, 200);
        return;
      }

      let indicatorModel = 'generic';
      let customRegex = '';
      try {
        const res = await fetch('/setup/settings');
        const r = await res.json();
        if (r.success && r.data) {
          indicatorModel = r.data.serial_indicator_model || 'generic';
          customRegex = r.data.serial_custom_regex || '';
        }
      } catch (e) { console.error(e); }

      window.serialConnector = new AutoSerialConnector({
        targetInputId: 'beratInputForm',
        indicatorModel: indicatorModel,
        customRegex: customRegex,
        autoReconnect: true,
        maxReconnectAttempts: 10,
        reconnectInterval: 3000,
        onConnect: () => {
          document.getElementById('weightStatus').textContent = 'TERHUBUNG';
          const badge = document.getElementById('connectionBadge');
          if (badge) {
            badge.className = 'scale-status-dot connected mt-2';
          }
          document.getElementById('toggleConnection').textContent = 'PUTUSKAN';
          document.getElementById('toggleConnection').className = 'btn w-100 bg-neoPink hover:bg-[#ff3399] text-white font-black py-2.5 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]';
        },
        onDisconnect: () => {
          document.getElementById('weightDisplay').textContent = '0';
          document.getElementById('weightStatus').textContent = 'TERPUTUS';
          const badge = document.getElementById('connectionBadge');
          if (badge) {
            badge.className = 'scale-status-dot disconnected mt-2';
          }
          document.getElementById('toggleConnection').textContent = 'SAMBUNG';
          document.getElementById('toggleConnection').className = 'btn w-100 bg-neoBlue hover:bg-[#3385ff] text-white font-black py-2.5 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]';
        },
        onData: (weight) => {
          const wd = document.getElementById('weightDisplay');
          wd.textContent = Math.floor(weight).toLocaleString('id-ID');
          wd.dataset.rawWeight = Math.floor(weight);
        },
        onError: (err) => {
          console.error('Serial error:', err);
          document.getElementById('weightStatus').textContent = 'ERROR';
          const badge = document.getElementById('connectionBadge');
          if (badge) {
            badge.className = 'scale-status-dot waiting mt-2';
          }
        }
      });

      // Auto connect
      window.serialConnector.autoConnect({ maxRetries: 10, skipValidation: true, autoPrompt: true });

      // Toggle button
      document.getElementById('toggleConnection').addEventListener('click', async function () {
        if (window.serialConnector.isConnected) {
          await window.serialConnector.disconnect();
        } else {
          await window.serialConnector.manualConnect();
        }
      });
    }

    // ─── PENTING: Tutup port saat pindah halaman ──────────────────────────────
    window.addEventListener('beforeunload', function () {
      if (window.serialConnector && window.serialConnector.isConnected) {
        try {
          window.serialConnector.isConnected = false;
          if (window.serialConnector.reader) {
            window.serialConnector.reader.cancel().catch(() => { });
            try { window.serialConnector.reader.releaseLock(); } catch (e) { }
          }
          if (window.serialConnector.port) {
            window.serialConnector.port.close().catch(() => { });
          }
        } catch (e) { /* ignore */ }
      }
    });
  </script>
  <script src="/js/sidebar.js"></script>
</body>

</html>
