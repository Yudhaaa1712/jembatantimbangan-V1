<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Surat Jalan</title>
  <link rel="stylesheet" href="/assets/css/print.css">
</head>
<body class="paper-a5-landscape">
  <div class="no-print text-center mb-[10px]">
    <button class="py-[8px] px-[20px] text-[14px] cursor-pointer" onclick="window.print()">🖨️ Cetak Surat Jalan</button>
    <button class="py-[8px] px-[20px] text-[14px] cursor-pointer ml-[10px]" onclick="window.close()">✕ Tutup</button>
  </div>

  <div class="sj-container" id="sjContent">
    <div class="company-header">
      <div class="company-name" id="companyName">PERUSAHAAN</div>
      <div class="company-address" id="companyAddress">Alamat</div>
      <div class="company-address" id="companyPhone">Telepon</div>
    </div>

    <div class="sj-title">SURAT JALAN</div>
    <div class="sj-number">No: <strong id="noSJ">-</strong></div>

    <div class="info-grid">
      <div class="info-item"><span class="info-label">Tanggal</span><span class="info-value" id="sjTanggal">-</span></div>
      <div class="info-item"><span class="info-label">No. Polisi</span><span class="info-value" id="sjPolisi">-</span></div>
      <div class="info-item"><span class="info-label">Nama Supir</span><span class="info-value" id="sjSupir">-</span></div>
      <div class="info-item"><span class="info-label">Tujuan Pabrik</span><span class="info-value" id="sjPabrik">-</span></div>
    </div>

    <table class="weight-table">
      <thead>
        <tr><th class="w-[40%]">Keterangan</th><th>Berat (Kg)</th></tr>
      </thead>
      <tbody>
        <tr><td>Berat Bruto</td><td id="sjBruto">0</td></tr>
        <tr><td>Berat Tara</td><td id="sjTara">0</td></tr>
        <tr class="netto-row"><td>Netto</td><td id="sjNetto">0</td></tr>
      </tbody>
    </table>

    <div class="notes">Keterangan: <span id="sjKeterangan">-</span></div>

    <div class="signature-grid">
      <div class="sig-box">
        <div class="sig-title">Pengirim</div>
        <div class="sig-line">( ........................ )</div>
      </div>
      <div class="sig-box">
        <div class="sig-title">Supir</div>
        <div class="sig-line">( <span id="sigSupir">........................</span> )</div>
      </div>
    </div>
  </div>

  <script>
  async function loadData() {
    const pathParts = window.location.pathname.split('/');
    const id = pathParts[pathParts.length - 1];

    // Load shipment data
    try {
      const res = await fetch(`/pengiriman/detail/${id}`);
      const r = await res.json();
      if (r.success) {
        const d = r.data;
        
        // Isi Header (Company)
        document.getElementById('companyName').textContent = d.company?.company_name || 'PERUSAHAAN';
        document.getElementById('companyAddress').textContent = d.company?.company_address || '';
        document.getElementById('companyPhone').textContent = d.company?.company_phone || '';

        // Isi Data Surat Jalan
        document.getElementById('noSJ').textContent = d.no_surat_jalan;
        document.getElementById('sjTanggal').textContent = d.tanggal ? new Date(d.tanggal).toLocaleDateString('id-ID') : '-';
        document.getElementById('sjPolisi').textContent = d.no_polisi;
        document.getElementById('sjSupir').textContent = d.nama_supir;
        document.getElementById('sjPabrik').textContent = d.nama_pabrik;
        document.getElementById('sjBruto').textContent = Number(d.berat_bruto).toLocaleString('id-ID');
        document.getElementById('sjTara').textContent = Number(d.berat_tara).toLocaleString('id-ID');
        document.getElementById('sjNetto').textContent = Number(d.netto_ram).toLocaleString('id-ID');
        document.getElementById('sjKeterangan').textContent = d.keterangan || '-';
        document.getElementById('sigSupir').textContent = d.nama_supir;

        // Auto print after load
        setTimeout(() => window.print(), 500);
      }
    } catch(e) { console.error('Error loading data:', e); }
  }
  document.addEventListener('DOMContentLoaded', loadData);
  </script>
    <script src="/js/sidebar.js"></script>
</body>
</html>
