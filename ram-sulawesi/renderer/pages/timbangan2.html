<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timbangan Keluar - Weighbridge Arroyan</title>
  <link rel="stylesheet" href="/assets/css/app.css">
    <link rel="stylesheet" href="/assets/css/sweetalert2.min.css">
</head>
<body class="page-weigh">
  <div id="site-header"></div>

  <div class="w-full px-4">
    <form id="timbangan2Form" data-formnav>
      <input type="hidden" id="idTransaksi" name="id_transaksi">

      <!-- PILIH TIKET - FULL WIDTH -->
      <div class="terminal-box">
        <div class="flex justify-between items-center mb-[10px]">
          <label class="terminal-label"><svg class="icon" aria-hidden="true"><use href="#i-ticket-detailed"></use></svg> Pilih Tiket</label>
          <div class="flex items-center gap-[10px]">
            <div class="badge bg-ink-600 text-[0.75rem]" id="serialConfigStatus2">
              <svg class="icon" aria-hidden="true"><use href="#i-plug-fill"></use></svg> <span id="currentBaudRate2">9600</span>
            </div>
          </div>
        </div>
        <div class="grid [grid-template-columns:1fr_auto_auto] gap-[10px]">
          <select name="no_tiket1" class="terminal-select" id="tiketSelector" required>
            <option value="">-- PILIH TIKET --</option>
          </select>
          <button type="button" class="terminal-btn terminal-btn-danger bg-[#dc2626] text-[#fff]" id="cancelTiketBtn" style="display:none">
            <svg class="icon" aria-hidden="true"><use href="#i-trash-fill"></use></svg> BATALKAN
          </button>
          <button type="button" class="terminal-btn" id="refreshTiketBtn" onclick="loadPendingTickets()">
            <svg class="icon" aria-hidden="true"><use href="#i-arrow-clockwise"></use></svg> REFRESH
          </button>
        </div>
      </div>

      <!-- MAIN LAYOUT: 3 COLUMNS -->
      <div class="grid grid-cols-3 gap-[12px] mb-[15px]" id="timbangan2Section">

        <!-- COLUMN 1: DATA TIMBANGAN MASUK -->
        <div class="terminal-box">
          <div class="flex justify-between items-center mb-[8px]">
            <label class="terminal-label m-0"><svg class="icon" aria-hidden="true"><use href="#i-database"></use></svg> Data Timbangan Masuk</label>
            <span class="badge text-[11px] py-[4px] px-[8px] font-bold rounded-[4px]" id="modeTimbanganBadge" style="display:none"></span>
          </div>
          <div class="grid grid-cols-2 gap-[10px]">
            <div class="mb-[10px]" id="t1field_no_kendaraan">
              <label class="terminal-label text-[12px]">No Kendaraan</label>
              <input type="text" class="terminal-input text-[16px] p-[8px]" id="displayKendaraan" readonly>
            </div>
            <div class="mb-[10px]" id="t1field_nama_pengemudi">
              <label class="terminal-label text-[12px]">Supir</label>
              <input type="text" class="terminal-input text-[16px] p-[8px]" id="displayPengemudi" readonly>
            </div>
            <div class="mb-[10px]" id="t1field_nama_suplier">
              <label class="terminal-label text-[12px]">Supplier</label>
              <input type="text" class="terminal-input text-[16px] p-[8px]" id="displaySuplier" readonly>
            </div>
            <div class="mb-[10px]" id="t1field_material">
              <label class="terminal-label text-[12px]">Material</label>
              <input type="text" class="terminal-input text-[16px] p-[8px]" id="displayMaterial" readonly>
            </div>

            <div class="mb-[10px]">
              <label class="terminal-label text-[12px]">Bruto (Timbangan Masuk)</label>
              <input type="text" class="terminal-input text-[16px] p-[8px]" id="displayBerat1" readonly>
              <input type="hidden" id="beratT1Hidden">
            </div>
            <div class="mb-[10px]" id="t2field_persen_potongan">
              <label class="terminal-label text-[12px]">Potongan (%)</label>
              <input type="number" name="persen_potongan" class="terminal-input text-[16px] p-[8px]" id="persenPotongan" 
                     step="0.01" min="0" max="100">
            </div>
            <div class="mb-[10px]" id="t2field_keterangan">
              <label class="terminal-label text-[12px]">Keterangan</label>
              <input type="text" name="keterangan" id="keteranganInput" class="terminal-input text-[16px] p-[8px]">
            </div>
            <div class="mb-[10px]" id="t2field_harga">
              <label class="terminal-label text-[12px]">Harga per Kg</label>
              <input type="text" class="terminal-input text-[16px] p-[8px]" id="displayHarga" placeholder="Rp 0">
              <input type="hidden" name="harga_input_t2" id="hargaHiddenT2" value="0">
            </div>
            
            <div class="mb-[10px]" style="display:none" id="t2field_potongan_hutang">
              <div class="mb-2">
                <label class="terminal-label text-[12px] text-[#f59e0b]">Potongan Hutang (Max: <span id="maxSupirDebt">0</span>)</label>
                <input type="text" inputmode="numeric" name="potongan_hutang_rp" class="terminal-input format-rupiah text-[16px] p-[8px]" id="potonganHutangInput"
                       placeholder="0">
                <input type="hidden" id="supirDebtVal" value="0">
              </div>
            </div>

            <div class="mb-[10px]" style="display:none" id="t2field_potongan_hutang_supplier">
              <div class="mb-2">
                <label class="terminal-label text-[12px] text-[#3b82f6]">Potongan Hutang Supplier (Max: <span id="maxSupplierDebt">0</span>)</label>
                <input type="text" inputmode="numeric" name="potongan_hutang_supplier_rp" class="terminal-input format-rupiah text-[16px] p-[8px]" id="potonganHutangSupplierInput"
                       placeholder="0">
                <input type="hidden" id="supplierDebtVal" value="0">
              </div>
            </div>
            
            <div class="mb-[10px]" id="t2field_potongan_muat">
              <label class="terminal-label text-[12px] text-[#f59e0b]">Upah Bongkar</label>
              <select id="opsiUpahBongkar" class="terminal-select text-[14px] p-[8px] mb-[5px]">
                <option value="0">Tanpa Upah Bongkar (Rp 0)</option>
                <option value="10">Rp 10 x Netto Akhir</option>
                <option value="15">Rp 15 x Netto Akhir</option>
                <option value="manual">Manual (Input Sendiri)</option>
              </select>
              <input type="text" inputmode="numeric" name="potongan_muat_rp" class="terminal-input format-rupiah text-[16px] p-[8px]" id="potonganMuatInput"
                     placeholder="0">
            </div>

          </div>
        </div>

        <!-- COLUMN 2: PERHITUNGAN OTOMATIS -->
        <div class="terminal-box">
          <label class="terminal-label"><svg class="icon" aria-hidden="true"><use href="#i-clipboard-data"></use></svg> Hasil Perhitungan</label>
          <div class="grid grid-cols-2 gap-[5px]">
            <div class="result-item p-[8px]">
              <div class="result-label text-[9px]">Bruto</div>
              <div class="result-value text-[12px]" id="hasilBruto">0</div>
            </div>
            <div class="result-item p-[8px]">
              <div class="result-label text-[9px]">Tara</div>
              <div class="result-value text-[12px]" id="hasilTara">0</div>
            </div>
            <div class="result-item p-[8px]">
              <div class="result-label text-[9px]">Netto Awal</div>
              <div class="result-value text-[12px]" id="hasilNettoBT">0</div>
            </div>
            <div class="result-item p-[8px]" id="result_persen_potongan">
              <div class="result-label text-[9px]">Potongan (%)</div>
              <div class="result-value text-[12px]">
                <span id="hasilPotonganPersen">0%</span> <span class="text-[10px] opacity-[0.8]" id="hasilPotongan">= 0 Kg</span>
              </div>
            </div>
            <div class="result-item p-[8px]">
              <div class="result-label text-[9px]">Netto Akhir</div>
              <div class="result-value text-[12px]" id="hasilNettoAkhir">0</div>
            </div>
            <div class="result-item p-[8px]" id="result_harga">
              <div class="result-label text-[9px]">Harga/Kg</div>
              <div class="result-value text-[12px]" id="hasilHargaPerKg">0</div>
            </div>
            <div class="result-item p-[8px]" id="result_potongan_hutang" style="display:none">
              <div class="result-label text-[9px]">Potongan Hutang</div>
              <div class="result-value text-[12px] text-[#ef4444]" id="hasilPotonganHutang">0</div>
            </div>
            <div class="result-item p-[8px]" id="result_potongan_hutang_supplier" style="display:none">
              <div class="result-label text-[9px]">Potongan Hutang Supplier</div>
              <div class="result-value text-[12px] text-[#3b82f6]" id="hasilPotonganHutangSupplier">0</div>
            </div>
            <div class="result-item p-[8px]" id="result_potongan_muat" style="display:none">
              <div class="result-label text-[9px]">Upah Bongkar</div>
              <div class="result-value text-[12px] text-[#ef4444]" id="hasilPotonganMuat">0</div>
            </div>
            
          </div>
          
          <!-- Panel trip langsir: tiap trip punya tara sendiri, netto dijumlahkan -->
          <div class="mt-[8px] border border-[#f59e0b] bg-[#3a2a0a] p-[6px]" id="langsirPanel" style="display:none">
            <div class="text-[#fbbf24] text-[9px] font-bold mb-[4px]">
              <svg class="icon" aria-hidden="true"><use href="#i-truck-flatbed"></use></svg> TRIP LANGSIR
            </div>
            <div id="langsirTripList" class="text-[10px] leading-tight"></div>
            <div class="mt-[5px] pt-[4px] border-t border-[#f59e0b] text-[10px] text-[#fbbf24]" id="langsirTotal"></div>
            <button type="button" class="terminal-btn terminal-btn-warning w-full mt-[6px] py-[6px] text-[10px]" id="btnSimpanTara">
              <svg class="icon" aria-hidden="true"><use href="#i-save"></use></svg> SIMPAN TARA TRIP INI
            </button>
            <div class="text-[9px] mt-[4px] leading-tight text-[#fcd34d]" id="langsirHint"></div>
          </div>

          <div class="mt-[8px] grid [grid-template-columns:1fr_auto] gap-[8px] items-stretch">
            <div>
              <div class="result-item border-[2px] border-[#10b981] bg-[#064e3b] p-[4px]">
                <div class="result-label text-[#34d399] text-[8px]">TOTAL BAYAR</div>
                <div class="result-value text-[#34d399] text-[16px] font-black" id="hasilTotalHargaFinal">0</div>
              </div>
              <div class="result-item border border-[#3b82f6] bg-[#1e3a5f] p-[3px] mt-[4px]" id="kasContainerT2">
                <div class="result-label text-[#93c5fd] text-[7px]">SISA KAS</div>
                <div class="result-value text-[#60a5fa] text-[11px]" id="saldoKasDisplay">Rp 0</div>
              </div>
            </div>
            <button type="submit" class="terminal-btn terminal-btn-primary py-[8px] px-[15px] whitespace-nowrap text-[10px]" id="saveButton"
                   >
              <svg class="icon" aria-hidden="true"><use href="#i-save-fill"></use></svg> SIMPAN & CETAK
            </button>
          </div>
        </div>

        <!-- COLUMN 3: DISPLAY PANEL -->
        <div class="terminal-box">
          <label class="terminal-label"><svg class="icon" aria-hidden="true"><use href="#i-display"></use></svg> Display</label>
          <div class="display-panel min-h-[0px] p-[10px]">
            <div class="display-value text-[72px] my-[10px] mx-0 font-black" id="weightDisplay2Large">0 KG</div>
            <div class="display-status text-[16px]" id="weightStatus2">Menunggu...</div>
            <button type="button" class="terminal-btn terminal-btn-info mt-[10px] w-full p-[12px] text-[16px]" id="toggleConnection2"
                   >
              <svg class="icon" aria-hidden="true"><use href="#i-plug-fill"></use></svg> SAMBUNGKAN
            </button>
            <button type="button" class="terminal-btn terminal-btn-warning mt-[10px] w-full p-[12px] text-[16px]" id="captureWeight2"
                   >
              <svg class="icon" aria-hidden="true"><use href="#i-camera-fill"></use></svg> AMBIL BERAT
            </button>
          </div>

          <!-- INPUT BERAT -->
          <div class="mt-[5px]">
            <label class="terminal-label text-[#28a745] font-bold text-[16px]">
              BERAT TERTANGKAP
            </label>
            <input type="number" class="terminal-input bg-[#28a745] text-[#fff] text-[28px] font-bold h-auto p-[15px]" id="beratInput2" step="1" min="0" 
                  >
          </div>
        </div>
      </div>
    </form>
  </div>

  <script src="/assets/js/jquery-3.7.1.min.js"></script>
  <script src="/assets/js/sweetalert2.min.js"></script>
  <script src="/js/auto-serial-connect.js" defer></script>
  <script src="/js/form-nav.js" defer></script>
  
  <script>
  window.activePage = 'timbangan2';

  function formatRibuan(angka) {
      if(!angka) return '0';
      return new Intl.NumberFormat('id-ID').format(angka);
  }

  async function loadPendingTickets() {
    try {
      const res = await fetch('/timbangan/ajax', { 
          method:'POST', 
          headers:{'Content-Type':'application/json'}, 
          body:JSON.stringify({action:'get_pending_tickets'}) 
      });
      const data = await res.json();
      const sel = document.getElementById('tiketSelector');
      sel.innerHTML = '<option value="">-- PILIH TIKET --</option>';
      if (data.data) {
        data.data.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.no_tiket;
          opt.textContent = `${t.nama_supir} - ${t.no_tiket}`;
          // Store data in dataset
          opt.dataset.kendaraan = t.no_polisi || '';
          opt.dataset.pengemudi = t.nama_supir || '';
          opt.dataset.suplier = t.nama_supplier || '';
          opt.dataset.material = (t.jenis_material || '').toUpperCase();
          opt.dataset.harga = t.harga_per_kg || 0;
          opt.dataset.defaultHarga = t.default_harga || 0;
          opt.dataset.defaultPotongan = t.default_potongan || 0;
          opt.dataset.berat = t.berat_bruto || t.berat_timbangan1 || 0;
          opt.dataset.keterangan = t.keterangan || '';
          opt.dataset.id = t.id;
          opt.dataset.mode = t.mode_timbangan || 'beli';
          opt.dataset.isLangsir = t.is_langsir || 0;
          opt.dataset.tripLangsir = t.jumlah_trip_langsir || 1;
          sel.appendChild(opt);
        });
      }
    } catch(e) { console.error('Error loading tickets', e); }
  }

  document.getElementById('tiketSelector').addEventListener('change', async function() {
    const opt = this.options[this.selectedIndex];
    if (this.value === '') {
        document.getElementById('timbangan2Form').reset();
        document.getElementById('supirDebtVal').value = 0;
        document.getElementById('maxSupirDebt').textContent = '0';
        document.getElementById('potonganHutangInput').value = '';
        document.getElementById('cancelTiketBtn').style.display = 'none';
        return;
    }
    
    document.getElementById('cancelTiketBtn').style.display = 'inline-block';
    
    document.getElementById('idTransaksi').value = opt.dataset.id;
    document.getElementById('displayKendaraan').value = opt.dataset.kendaraan;
    document.getElementById('displayPengemudi').value = opt.dataset.pengemudi;
    document.getElementById('displaySuplier').value = opt.dataset.suplier;
    document.getElementById('displayMaterial').value = opt.dataset.material;
    
    const berat1 = parseFloat(opt.dataset.berat);
    document.getElementById('beratT1Hidden').value = berat1;
    document.getElementById('displayBerat1').value = formatRibuan(berat1) + ' Kg';
    
    document.getElementById('keteranganInput').value = opt.dataset.keterangan;
    
    let harga = parseFloat(opt.dataset.harga);
    const defHarga = parseFloat(opt.dataset.defaultHarga);
    if (defHarga > 0) harga = defHarga; // Override with supplier default if exists
    
    document.getElementById('hargaHiddenT2').value = harga;
    document.getElementById('displayHarga').value = harga > 0 ? formatRibuan(harga) : '';
    
    const defPotongan = parseFloat(opt.dataset.defaultPotongan);
    document.getElementById('persenPotongan').value = defPotongan > 0 ? defPotongan : '';
    
    
    // Show/hide Mode Badge
    const mode = opt.dataset.mode || 'beli';
    const modeBadge = document.getElementById('modeTimbanganBadge');
    if (modeBadge) {
      modeBadge.style.display = 'inline-block';
      if (mode === 'jual') {
        modeBadge.textContent = 'MODE JUAL';
        modeBadge.style.backgroundColor = '#2563eb';
        modeBadge.style.color = '#fff';
      } else {
        modeBadge.textContent = 'MODE BELI';
        modeBadge.style.backgroundColor = '#10b981';
        modeBadge.style.color = '#fff';
      }
      
      const isLangsir = parseInt(opt.dataset.isLangsir) === 1;
      if (isLangsir) {
        const tripCount = opt.dataset.tripLangsir || 1;
        modeBadge.textContent = `MODE LANGSIR (${tripCount} TRIP)`;
        modeBadge.style.backgroundColor = '#f59e0b';
      }
    }

    muatTripLangsir();

    // Reset supir debt inputs
    document.getElementById('supirDebtVal').value = 0;
    document.getElementById('maxSupirDebt').textContent = '0';
    document.getElementById('potonganHutangInput').value = '';
    document.getElementById('t2field_potongan_hutang').style.display = 'none';

    // Reset supplier debt inputs
    document.getElementById('supplierDebtVal').value = 0;
    document.getElementById('maxSupplierDebt').textContent = '0';
    document.getElementById('potonganHutangSupplierInput').value = '';
    document.getElementById('t2field_potongan_hutang_supplier').style.display = 'none';

    document.getElementById('opsiUpahBongkar').value = '0';
    document.getElementById('potonganMuatInput').value = '';
    
    if (window.isHutangActive && opt.dataset.pengemudi) {
      try {
        const res = await fetch('/hutang-supir-api/supir/check-debt?name=' + encodeURIComponent(opt.dataset.pengemudi));
        const d = await res.json();
        if (d.success && d.data && d.data.total_hutang > 0) {
          document.getElementById('supirDebtVal').value = d.data.total_hutang || 0;
          document.getElementById('maxSupirDebt').textContent = formatRibuan(d.data.total_hutang || 0);
          document.getElementById('t2field_potongan_hutang').style.display = 'block';
        }
      } catch(e) { console.error('Fetch supir debt error:', e); }
    }

    if (opt.dataset.suplier) {
      try {
        const res = await fetch('/hutang-supplier-api/supplier/check-debt?name=' + encodeURIComponent(opt.dataset.suplier));
        const d = await res.json();
        if (d.success && d.data && d.data.total_hutang > 0) {
          document.getElementById('supplierDebtVal').value = d.data.total_hutang || 0;
          document.getElementById('maxSupplierDebt').textContent = formatRibuan(d.data.total_hutang || 0);
          document.getElementById('t2field_potongan_hutang_supplier').style.display = 'block';
        }
      } catch(e) { console.error('Fetch supplier debt error:', e); }
    }
    
    hitungKalkulasi();
  });

  function hitungKalkulasi() {
      const t1Weight = parseFloat(document.getElementById('beratT1Hidden').value) || 0;
      const t2Weight = parseFloat(document.getElementById('beratInput2').value) || 0;
      const persen = parseFloat(document.getElementById('persenPotongan').value) || 0;
      const harga = parseFloat(document.getElementById('hargaHiddenT2').value) || 0;
      
      const selector = document.getElementById('tiketSelector');
      const opt = selector.options[selector.selectedIndex];
      const mode = opt ? (opt.dataset.mode || 'beli') : 'beli';
      const isModeJual = mode === 'jual';

      const isLangsirTiket = opt ? parseInt(opt.dataset.isLangsir) === 1 : false;
      const L = window.langsirInfo;

      // Pada tiket langsir, bruto/tara/netto diambil dari akumulasi tiap trip —
      // berat di layar (beratInput2) itu tara trip yang sedang ditimbang, bukan
      // tara tiket. Kalau dipakai sebagai pengurang, tara trip lain akan hilang.
      const bruto = isLangsirTiket && L ? L.total_bruto : (isModeJual ? t2Weight : t1Weight);
      const tara  = isLangsirTiket && L ? L.total_tara  : (isModeJual ? t1Weight : t2Weight);

      document.getElementById('hasilBruto').textContent = formatRibuan(bruto);
      document.getElementById('hasilTara').textContent = formatRibuan(tara);

      const nettoAwal = isLangsirTiket && L
        ? Math.max(0, L.total_netto)
        : Math.max(0, bruto - tara);
      document.getElementById('hasilNettoBT').textContent = formatRibuan(nettoAwal);
      
      const kgPotongan = Math.max(0, Math.round((persen / 100) * nettoAwal));
      document.getElementById('hasilPotonganPersen').textContent = persen + '%';
      document.getElementById('hasilPotongan').textContent = '= ' + formatRibuan(kgPotongan) + ' Kg';
      
      const nettoAkhir = Math.max(0, Math.round(nettoAwal - kgPotongan));
      document.getElementById('hasilNettoAkhir').textContent = formatRibuan(nettoAkhir);
      
      document.getElementById('hasilHargaPerKg').textContent = formatRibuan(harga);
      
      const totalAwal = nettoAkhir * harga;
      
      let potonganHutang = 0;
      let tambahHutang = 0;
      
      if (window.isHutangActive) {
        const supirDebt = parseFloat(document.getElementById('supirDebtVal').value) || 0;
        const maxPotongan = Math.max(0, Math.min(supirDebt, totalAwal));
        
        let pInput = getRawNumber(document.getElementById('potonganHutangInput').value) || 0;
        if (pInput > maxPotongan) {
          pInput = maxPotongan;
          document.getElementById('potonganHutangInput').value = formatRupiah(pInput);
        }
        potonganHutang = pInput;
        
        document.getElementById('result_potongan_hutang').style.display = potonganHutang > 0 ? '' : 'none';
        document.getElementById('hasilPotonganHutang').textContent = '- Rp ' + formatRibuan(potonganHutang);
      }
      
      let potonganHutangSupplier = 0;
      const supplierDebt = parseFloat(document.getElementById('supplierDebtVal').value) || 0;
      const maxPotonganSupplier = Math.max(0, Math.min(supplierDebt, totalAwal - potonganHutang));
      
      let pSupplierInput = getRawNumber(document.getElementById('potonganHutangSupplierInput').value) || 0;
      if (pSupplierInput > maxPotonganSupplier) {
        pSupplierInput = maxPotonganSupplier;
        document.getElementById('potonganHutangSupplierInput').value = formatRupiah(pSupplierInput);
      }
      potonganHutangSupplier = pSupplierInput;
      
      document.getElementById('result_potongan_hutang_supplier').style.display = potonganHutangSupplier > 0 ? '' : 'none';
      document.getElementById('hasilPotonganHutangSupplier').textContent = '- Rp ' + formatRibuan(potonganHutangSupplier);
      
      const fieldBongkarContainer = document.getElementById('t2field_potongan_muat');
      const isBongkarDisabled = fieldBongkarContainer && fieldBongkarContainer.style.display === 'none';
      
      let potonganMuat = 0;
      if (isBongkarDisabled) {
        potonganMuat = 0;
        if (document.getElementById('potonganMuatInput')) document.getElementById('potonganMuatInput').value = '';
        if (document.getElementById('opsiUpahBongkar')) document.getElementById('opsiUpahBongkar').value = '0';
      } else {
        const opsiBongkar = document.getElementById('opsiUpahBongkar').value;
        if (opsiBongkar === '15') {
          potonganMuat = nettoAkhir * 15;
          document.getElementById('potonganMuatInput').value = formatRupiah(potonganMuat);
          document.getElementById('potonganMuatInput').readOnly = true;
        } else if (opsiBongkar === '10') {
          potonganMuat = nettoAkhir * 10;
          document.getElementById('potonganMuatInput').value = formatRupiah(potonganMuat);
          document.getElementById('potonganMuatInput').readOnly = true;
        } else if (opsiBongkar === '0') {
          potonganMuat = 0;
          document.getElementById('potonganMuatInput').value = '';
          document.getElementById('potonganMuatInput').readOnly = true;
        } else {
          document.getElementById('potonganMuatInput').readOnly = false;
          potonganMuat = getRawNumber(document.getElementById('potonganMuatInput').value) || 0;
        }
      }
      document.getElementById('result_potongan_muat').style.display = (potonganMuat > 0 && !isBongkarDisabled) ? '' : 'none';
      document.getElementById('hasilPotonganMuat').textContent = '- Rp ' + formatRibuan(potonganMuat);
      
      const totalAkhir = Math.max(0, totalAwal - potonganHutang - potonganHutangSupplier - potonganMuat);
      document.getElementById('hasilTotalHargaFinal').textContent = 'Rp ' + formatRibuan(totalAkhir);

      fetch('/timbangan/debug-calc', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          t1Weight,
          t2Weight,
          isModeJual,
          bruto,
          tara,
          nettoAwal,
          kgPotongan,
          nettoAkhir,
          totalAwal,
          totalAkhir,
          potonganHutang,
          potonganHutangSupplier,
          potonganMuat,
          harga
        })
      }).catch(() => {});
  }

  // Event Listeners Input Uang / Angka
  ['displayHarga'].forEach(id => {
      document.getElementById(id).addEventListener('input', function() {
          const val = this.value.replace(/[^0-9]/g, '');
          const hiddenId = 'hargaHiddenT2';
          document.getElementById(hiddenId).value = val;
          if (val) this.value = formatRibuan(parseInt(val));
          hitungKalkulasi();
      });
  });

  document.getElementById('beratInput2').addEventListener('input', hitungKalkulasi);
  document.getElementById('persenPotongan').addEventListener('input', hitungKalkulasi);
  document.getElementById('potonganHutangInput').addEventListener('input', hitungKalkulasi);
  document.getElementById('potonganHutangSupplierInput').addEventListener('input', hitungKalkulasi);
  document.getElementById('potonganMuatInput').addEventListener('input', hitungKalkulasi);
  document.getElementById('opsiUpahBongkar').addEventListener('change', hitungKalkulasi);

  document.getElementById('captureWeight2').addEventListener('click', function() {
    const w = parseInt(document.getElementById('weightDisplay2Large').dataset.rawWeight) || 0;
    if (w > 0) {
      document.getElementById('beratInput2').value = w;
      window.isWeightLocked2 = true;
      this.innerHTML = '<svg class="icon" aria-hidden="true"><use href="#i-lock-fill"></use></svg> TERKUNCI';
      this.className = 'terminal-btn terminal-btn-success';
      this.style.width = '100%';
      this.style.marginTop = '10px';
      hitungKalkulasi();
    } else {
      Swal.fire({ icon:'warning', title:'Perhatian', text:'Belum ada berat dari timbangan' });
    }
  });

  document.getElementById('timbangan2Form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      if (!document.getElementById('tiketSelector').value) {
          Swal.fire({icon: 'warning', text: 'Pilih tiket terlebih dahulu!'});
          return;
      }
      
      const btn = document.getElementById('saveButton');
      btn.disabled = true; 
      btn.innerHTML = '<svg class="icon" aria-hidden="true"><use href="#i-hourglass-split"></use></svg> MENYIMPAN...';
      
      try {
          const t1Weight = parseFloat(document.getElementById('beratT1Hidden').value)||0;
          const t2Weight = parseFloat(document.getElementById('beratInput2').value)||0;
          
          const selector = document.getElementById('tiketSelector');
          const opt = selector.options[selector.selectedIndex];
          const mode = opt ? (opt.dataset.mode || 'beli') : 'beli';
          const isModeJual = mode === 'jual';

          const bruto = isModeJual ? t2Weight : t1Weight;
          const tara = isModeJual ? t1Weight : t2Weight;
          
          const persen = parseFloat(document.getElementById('persenPotongan').value)||0;
          const harga = parseFloat(document.getElementById('hargaHiddenT2').value)||0;
          
          const keterangan = document.getElementById('keteranganInput').value;
          
          const netto = Math.max(0, bruto - tara);
          const kgPot = Math.max(0, Math.round((persen/100)*netto));
          
          const payload = {
            action:'save_timbangan2',
            id_transaksi: document.getElementById('idTransaksi').value,
            berat_timbangan2: t2Weight,
            persen_potongan: persen,
            kg_potongan: kgPot,
            harga_per_kg: harga,
            potongan_hutang_rp: window.isHutangActive ? (getRawNumber(document.getElementById('potonganHutangInput').value) || 0) : 0,
            potongan_hutang_supplier_rp: getRawNumber(document.getElementById('potonganHutangSupplierInput').value) || 0,
            potongan_muat_rp: getRawNumber(document.getElementById('potonganMuatInput').value) || 0,
            // Pembelian selalu tersimpan sebagai BELUM DIBAYAR — kas baru bergerak
            // lewat menu Pembayaran. Penjualan tetap masuk kas seketika.
            metode_bayar: isModeJual ? 'tunai' : '',
            keterangan: keterangan
          };
          
          const res = await fetch('/timbangan/ajax', { 
              method:'POST', 
              headers:{'Content-Type':'application/json'}, 
              body:JSON.stringify(payload) 
          });
          const result = await res.json();
          
          if (result.success) {
            await Swal.fire({ icon:'success', title:'Berhasil!', text:result.message, timer:1500, showConfirmButton:false });
            const noTiket = document.getElementById('tiketSelector').value;
            window.open(`/print-ticket/${noTiket}`, '_blank', 'width=800,height=600');
            
            document.getElementById('timbangan2Form').reset();
            document.getElementById('supirDebtVal').value = 0;
            document.getElementById('maxSupirDebt').textContent = '0';
            document.getElementById('potonganHutangInput').value = '';
            document.getElementById('opsiUpahBongkar').value = '0';
            document.getElementById('potonganMuatInput').value = '';
            if (window.refreshBadgeBelumLunas) window.refreshBadgeBelumLunas();
            document.getElementById('cancelTiketBtn').style.display = 'none';
            window.isWeightLocked2 = false;
            document.getElementById('captureWeight2').innerHTML = '<svg class="icon" aria-hidden="true"><use href="#i-camera-fill"></use></svg> AMBIL BERAT';
            document.getElementById('captureWeight2').className = 'terminal-btn terminal-btn-warning';


            hitungKalkulasi();
            loadPendingTickets();
          } else {
            Swal.fire({ icon:'error', title:'Gagal', text:result.message });
          }
      } catch(err) {
          console.error(err);
          Swal.fire({ icon:'error', title:'Error', text:'Gagal menyimpan data' });
      } finally {
          btn.disabled = false;
          btn.innerHTML = '<svg class="icon" aria-hidden="true"><use href="#i-save-fill"></use></svg> SIMPAN & CETAK';
      }
  });

  // ─── Trip langsir ───────────────────────────────────────────────────────────
  // Tiket langsir tidak bisa dihargai sampai SETIAP trip punya taranya sendiri.
  // Netto tiket = jumlah netto tiap trip, bukan bruto akumulasi dikurangi satu tara.
  window.langsirInfo = null;

  function tiketAktifLangsir() {
    const selector = document.getElementById('tiketSelector');
    const opt = selector.options[selector.selectedIndex];
    if (!opt || !opt.value) return null;
    return parseInt(opt.dataset.isLangsir) === 1 ? opt : null;
  }

  async function muatTripLangsir() {
    const panel = document.getElementById('langsirPanel');
    const opt = tiketAktifLangsir();
    if (!opt) {
      panel.style.display = 'none';
      window.langsirInfo = null;
      aturTombolSimpan();
      return;
    }

    panel.style.display = 'block';
    try {
      const res = await fetch('/timbangan/ajax', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'get_langsir_trips', id_transaksi: document.getElementById('idTransaksi').value })
      });
      const r = await res.json();
      if (!r.success) throw new Error(r.message);
      window.langsirInfo = r.data;
      renderTripLangsir();
    } catch (e) {
      document.getElementById('langsirTripList').innerHTML =
        `<div class="text-[#fca5a5]">Gagal memuat trip: ${e.message}</div>`;
    }
    aturTombolSimpan();
  }

  function renderTripLangsir() {
    const d = window.langsirInfo;
    if (!d) return;
    document.getElementById('langsirTripList').innerHTML = d.trips.map(t => {
      const selesai = (t.status || 'bruto') === 'selesai';
      const warna = selesai ? '#86efac' : '#fca5a5';
      const tara = selesai ? formatRibuan(t.berat_tara) : 'menunggu';
      const netto = selesai ? formatRibuan(t.berat_netto) : '-';
      return `<div style="color:${warna}">
        Trip ${t.urutan} · ${(t.no_polisi || '-')} · bruto ${formatRibuan(t.berat_bruto)}
        · tara ${tara} · netto ${netto}
      </div>`;
    }).join('');

    document.getElementById('langsirTotal').innerHTML =
      `${d.jumlah_trip} trip · bruto ${formatRibuan(d.total_bruto)} − tara ${formatRibuan(d.total_tara)}
       = <b>netto ${formatRibuan(d.total_netto)} kg</b>`;

    const belum = d.trip_belum_tara;
    document.getElementById('btnSimpanTara').style.display = belum ? 'block' : 'none';
    document.getElementById('langsirHint').textContent = belum
      ? `Trip ke-${belum.urutan} (${belum.no_polisi || '-'}) menunggu tara. Timbang mobil kosongnya lalu tekan tombol di atas.`
      : 'Semua trip sudah ditara. Tiket siap disimpan.';
  }

  // Tombol simpan tiket dikunci selama masih ada trip yang menggantung, supaya
  // tiket tidak bisa dihargai dengan netto yang belum lengkap.
  function aturTombolSimpan() {
    const btn = document.getElementById('saveButton');
    if (!btn) return;
    const d = window.langsirInfo;
    const terkunci = !!(d && d.trip_belum_tara);
    btn.disabled = terkunci;
    btn.style.opacity = terkunci ? '0.5' : '';
    btn.title = terkunci ? 'Selesaikan tara semua trip langsir dulu' : '';
  }

  async function simpanTaraTrip() {
    const d = window.langsirInfo;
    if (!d || !d.trip_belum_tara) return;
    const tara = parseFloat(document.getElementById('beratInput2').value) || 0;
    if (tara <= 0) {
      Swal.fire({ icon: 'warning', title: 'Berat Kosong', text: 'Ambil berat tara mobil dari timbangan dulu.' });
      return;
    }

    const belum = d.trip_belum_tara;
    const konfirm = await Swal.fire({
      icon: 'question',
      title: `Simpan tara trip ke-${belum.urutan}?`,
      html: `<div style="text-align:left">
        <p><b>Mobil:</b> ${belum.no_polisi || '-'}</p>
        <p><b>Bruto trip:</b> ${formatRibuan(belum.berat_bruto)} kg</p>
        <p><b>Tara:</b> ${formatRibuan(tara)} kg</p>
        <p><b>Netto trip:</b> ${formatRibuan(Math.max(0, belum.berat_bruto - tara))} kg</p>
      </div>`,
      showCancelButton: true, confirmButtonText: 'Simpan Tara', cancelButtonText: 'Batal'
    });
    if (!konfirm.isConfirmed) return;

    const btn = document.getElementById('btnSimpanTara');
    btn.disabled = true;
    try {
      const res = await fetch('/timbangan/ajax', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'save_langsir_tara',
          id_transaksi: document.getElementById('idTransaksi').value,
          berat_tara: tara
        })
      });
      const r = await res.json();
      if (!r.success) throw new Error(r.message);

      Swal.fire({ icon: 'success', title: 'Tara Tersimpan', text: r.message, timer: 1600, showConfirmButton: false });
      document.getElementById('beratInput2').value = '';
      window.isWeightLocked2 = false;
      await muatTripLangsir();
      hitungKalkulasi();
    } catch (e) {
      Swal.fire({ icon: 'error', title: 'Gagal', text: e.message });
    } finally {
      btn.disabled = false;
    }
  }
  document.getElementById('btnSimpanTara').addEventListener('click', simpanTaraTrip);

  async function initSerialConnector2() {
    if (typeof AutoSerialConnector === 'undefined') { setTimeout(initSerialConnector2, 200); return; }
    
    let indicatorModel = 'generic';
    let customRegex = '';
    try {
      const res = await fetch('/setup/settings');
      const r = await res.json();
      if (r.success && r.data) {
        indicatorModel = r.data.serial_indicator_model || 'generic';
        customRegex = r.data.serial_custom_regex || '';
      }
    } catch(e) { console.error(e); }

    window.serialConnector2 = new AutoSerialConnector({
      targetInputId: 'beratInput2',
      indicatorModel: indicatorModel,
      customRegex: customRegex,
      autoReconnect: true,
      onConnect: () => {
        document.getElementById('weightStatus2').textContent = 'Terhubung ✓';
        document.getElementById('weightStatus2').style.color = '#10b981';
        document.getElementById('toggleConnection2').innerHTML = '<svg class="icon" aria-hidden="true"><use href="#i-plug-fill"></use></svg> PUTUSKAN';
        document.getElementById('toggleConnection2').className = 'terminal-btn terminal-btn-danger';
        document.getElementById('toggleConnection2').style.width = '100%';
        document.getElementById('toggleConnection2').style.marginTop = '10px';
      },
      onDisconnect: () => {
        document.getElementById('weightDisplay2Large').textContent = '0 KG';
        document.getElementById('weightStatus2').textContent = 'Terputus';
        document.getElementById('weightStatus2').style.color = '#ef4444';
        document.getElementById('toggleConnection2').innerHTML = '<svg class="icon" aria-hidden="true"><use href="#i-plug-fill"></use></svg> SAMBUNGKAN';
        document.getElementById('toggleConnection2').className = 'terminal-btn terminal-btn-info';
        document.getElementById('toggleConnection2').style.width = '100%';
        document.getElementById('toggleConnection2').style.marginTop = '10px';
      },
      onData: (w) => {
        const wd2 = document.getElementById('weightDisplay2Large');
        wd2.textContent = Math.floor(w).toLocaleString('id-ID') + ' KG';
        wd2.dataset.rawWeight = Math.floor(w);
      }
    });
    window.serialConnector2.autoConnect({ maxRetries:10, skipValidation:true });
    document.getElementById('toggleConnection2').addEventListener('click', async function() {
      if (window.serialConnector2.isConnected) await window.serialConnector2.disconnect();
      else await window.serialConnector2.manualConnect();
    });
  }

  // Kas Balance
  async function loadKasSaldo() {
    if(document.getElementById('kasContainerT2') && document.getElementById('kasContainerT2').style.display === 'none') return;
    try {
      const res = await fetch('/kas/saldo');
      const r = await res.json();
      if (r.success) {
        const saldo = Number(r.data.saldo);
        document.getElementById('saldoKasDisplay').textContent = 'Rp ' + saldo.toLocaleString('id-ID');
      }
    } catch(e) { /* ignore */ }
  }

  // Load Settings
  async function loadFieldSettings2() {
    try {
      const res = await fetch('/setup/settings');
      const r = await res.json();
      if (r.success && r.data.timbangan2_fields) {
        const fields = JSON.parse(r.data.timbangan2_fields);
        const fieldMap = {
          persen_potongan: 't2field_persen_potongan',
          harga: 't2field_harga',
          potongan_hutang: 't2field_potongan_hutang',
          potongan_muat: 't2field_potongan_muat',
          keterangan: 't2field_keterangan'
        };
        // Map result items to field keys for synced hiding
        const resultMap = {
          persen_potongan: 'result_persen_potongan',
          harga: 'result_harga',
          potongan_hutang: 'result_potongan_hutang',
          potongan_muat: 'result_potongan_muat'
        };
        Object.keys(fieldMap).forEach(key => {
          const el = document.getElementById(fieldMap[key]);
          if (!el) return;
          if (fields[key] === false) {
            el.style.display = 'none';
            el.querySelectorAll('input, select, textarea').forEach(inp => {
              inp.removeAttribute('required');
              if (inp.type !== 'hidden') inp.value = '';
            });
          } else {
            el.style.display = '';
          }
          // Also toggle the corresponding result item
          if (resultMap[key]) {
            const resultEl = document.getElementById(resultMap[key]);
            if (resultEl) resultEl.style.display = fields[key] === false ? 'none' : '';
          }
        });
      }
      if (r.success && r.data.timbangan1_fields) {
        const fields1 = JSON.parse(r.data.timbangan1_fields);
        const fieldMap1 = {
          no_kendaraan: 't1field_no_kendaraan',
          nama_pengemudi: 't1field_nama_pengemudi',
          nama_suplier: 't1field_nama_suplier',
          material: 't1field_material'
        };
        Object.keys(fieldMap1).forEach(key => {
          const el = document.getElementById(fieldMap1[key]);
          if (!el) return;
          if (fields1[key] === false) {
            el.style.display = 'none';
          } else {
            el.style.display = '';
          }
        });
      }
      // Also handle active_features: hide kas container if keuangan is off, hide hutang if hutang is off
      if (r.success && r.data.active_features) {
        try {
          const features = JSON.parse(r.data.active_features);
          // Hide Kas container if keuangan is off
          const kasContainer = document.getElementById('kasContainerT2');
          if (kasContainer) kasContainer.style.display = features.keuangan === false ? 'none' : '';
          
          window.isHutangActive = features.hutang === true;
          if (!window.isHutangActive) {
            const hField = document.getElementById('t2field_potongan_hutang');
            if (hField) hField.style.display = 'none';
            const hRes = document.getElementById('result_potongan_hutang');
            if (hRes) hRes.style.display = 'none';
          }
        } catch(e) {}
      }
    } catch(e) { console.warn('Load field settings error:', e); }
  }

  document.addEventListener('DOMContentLoaded', async function() {
    await loadSessionInfo();
    await loadPendingTickets();
    await loadFieldSettings2();
    loadKasSaldo();
    setTimeout(initSerialConnector2, 500);

    document.getElementById('cancelTiketBtn').addEventListener('click', async function() {
      const idVal = document.getElementById('idTransaksi').value;
      const tiketVal = document.getElementById('tiketSelector').value;
      if (!idVal || !tiketVal) {
        Swal.fire({ icon: 'warning', text: 'Pilih tiket terlebih dahulu!' });
        return;
      }

      const { value: reason } = await Swal.fire({
        title: 'Batalkan Tiket',
        text: `Apakah Anda yakin ingin membatalkan tiket ${tiketVal}?`,
        input: 'text',
        inputPlaceholder: 'Masukkan alasan pembatalan (opsional)',
        showCancelButton: true,
        confirmButtonText: 'Ya, Batalkan',
        cancelButtonText: 'Batal',
        confirmButtonColor: '#dc2626',
      });

      if (reason !== undefined) {
        try {
          const payload = {
            action: 'delete_timbangan1',
            id: idVal,
            cancel_reason: reason || 'Dibatalkan dari Timbangan Keluar'
          };
          const res = await fetch('/timbangan/ajax', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const result = await res.json();
          if (result.success) {
            Swal.fire({ icon: 'success', text: 'Tiket berhasil dibatalkan', timer: 1500, showConfirmButton: false });
            document.getElementById('timbangan2Form').reset();
            document.getElementById('supirDebtVal').value = 0;
            document.getElementById('maxSupirDebt').textContent = '0';
            document.getElementById('potonganHutangInput').value = '';
            document.getElementById('opsiUpahBongkar').value = '0';
            document.getElementById('potonganMuatInput').value = '';
            document.getElementById('cancelTiketBtn').style.display = 'none';
            hitungKalkulasi();
            loadPendingTickets();
          } else {
            Swal.fire({ icon: 'error', text: result.message });
          }
        } catch (err) {
          console.error(err);
          Swal.fire({ icon: 'error', text: 'Gagal membatalkan tiket' });
        }
      }
    });
  });

  window.addEventListener('beforeunload', function() {
    if (window.serialConnector2 && window.serialConnector2.isConnected) {
      try {
        window.serialConnector2.isConnected = false;
        if (window.serialConnector2.reader) {
          window.serialConnector2.reader.cancel().catch(() => {});
          try { window.serialConnector2.reader.releaseLock(); } catch(e) {}
        }
        if (window.serialConnector2.port) {
          window.serialConnector2.port.close().catch(() => {});
        }
      } catch(e) { /* ignore */ }
    }
  });
  </script>
