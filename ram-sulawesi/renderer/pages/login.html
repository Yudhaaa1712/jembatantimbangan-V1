<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Weighbridge Arroyan Jv Teknik</title>
  <link rel="stylesheet" href="/assets/css/app.css">
    <link rel="stylesheet" href="/assets/css/sweetalert2.min.css">
</head>
<body class="no-sidebar page-login">
  <div class="login-container">
    <div class="image-section">
      <div class="image-content">
        <div class="brand-logo">
          <img src="/assets/img/arroyan.png" alt="Logo" onerror="this.style.display='none'">
        </div>
        <h2>Sistem Jembatan Timbangan</h2>
        <p>Sistem timbangan digital terintegrasi untuk pengelolaan data transaksi yang akurat dan efisien</p>
      </div>
    </div>
    <div class="form-section">
      <div class="login-card">
        <div class="logo-section">
          <div class="logo-image">
            <img src="/assets/img/arroyan.png" alt="Logo Perusahaan" onerror="this.style.display='none'">
          </div>
          <h1>Selamat Datang</h1>
          <p>Weighbridge - Arroyan Jv Teknik</p>
        </div>
        <div id="alert-message" class="alert" style="display:none"></div>
        <form id="loginForm" data-formnav>
          <div class="mb-4">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="Masukkan username" required autocomplete="username">
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Masukkan password" required autocomplete="current-password">
          </div>
          <div class="form-check mb-4">
            <input type="checkbox" class="form-check-input" id="remember">
            <label class="form-check-label" for="remember">Ingat saya di perangkat ini</label>
          </div>
          <button type="submit" class="btn btn-login" id="btnLogin">
            <span id="btnSpinner" class="spinner" style="display:none"></span>
            <span id="btnText">Login</span>
          </button>
        </form>
      </div>
    </div>
  </div>
  <script src="/assets/js/jquery-3.7.1.min.js"></script>
  <script src="/assets/js/sweetalert2.min.js"></script>
  <script src="/js/form-nav.js"></script>
  <script>
  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnLogin');
    const spinner = document.getElementById('btnSpinner');
    const btnText = document.getElementById('btnText');
    const alertEl = document.getElementById('alert-message');

    btn.disabled = true;
    spinner.style.display = 'inline-block';
    btnText.textContent = 'Memproses...';
    alertEl.style.display = 'none';

    try {
      const formData = new FormData(this);
      const response = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: formData.get('username'),
          password: formData.get('password')
        })
      });
      const result = await response.json();

      if (result.success) {
        btnText.textContent = 'Berhasil!';
        window.location.href = result.data?.redirect || '/timbangan/1';
      } else {
        alertEl.className = 'alert alert-danger';
        alertEl.textContent = result.message || 'Login gagal';
        alertEl.style.display = 'block';
        btn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Login';
      }
    } catch (err) {
      alertEl.className = 'alert alert-danger';
      alertEl.textContent = 'Terjadi kesalahan koneksi';
      alertEl.style.display = 'block';
      btn.disabled = false;
      spinner.style.display = 'none';
      btnText.textContent = 'Login';
    }
  });
  </script>
    <script src="/js/icons.js"></script>
    <script src="/js/ui.js"></script>
</body>
</html>
