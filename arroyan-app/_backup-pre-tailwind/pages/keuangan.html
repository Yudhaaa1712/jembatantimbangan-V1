<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keuangan - Weighbridge</title>
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/sweetalert2.min.css">
  <link rel="stylesheet" href="/assets/css/bw-theme.css">
  <link rel="stylesheet" href="/assets/css/pages/keuangan-bw.css">
</head>
<body>
  <div id="site-header"></div>

  <div class="keuangan-container">
    <!-- Title Bar -->
    <div class="page-title-bar">
      <h2>BUKU KAS</h2>
      <span class="bulan-label" id="dateLabel">-</span>
    </div>

    <!-- Saldo Cards -->
    <div class="saldo-grid">
      <div class="saldo-card saldo-utama">
        <div class="saldo-label">Saldo Saat Ini</div>
        <div class="saldo-value" id="saldoUtama">Rp 0</div>
      </div>
      <div class="saldo-card debit-card">
        <div class="saldo-label">Total Pemasukan</div>
        <div class="saldo-value" id="totalDebit">Rp 0</div>
      </div>
      <div class="saldo-card kredit-card">
        <div class="saldo-label">Total Pengeluaran</div>
        <div class="saldo-value" id="totalKredit">Rp 0</div>
      </div>
    </div>

    <!-- Toolbar: Filters + Actions -->
    <div class="toolbar-row">
      <div class="filter-row" style="display:flex; align-items:flex-end; gap:15px;">
        <div class="filter-group">
          <label>Pilih Periode</label>
          <select id="dateFilterSelect" class="filter-control" onchange="handleFilterChange()" style="padding: 8px; border: 1px solid #ddd; border-radius: 4px; min-width: 150px;">
            <option value="today">Hari Ini</option>
            <option value="yesterday">Kemarin</option>
            <option value="week">7 Hari Terakhir</option>
            <option value="half_month">15 Hari Terakhir</option>
            <option value="month">Bulan Ini</option>
            <option value="half_year">6 Bulan Terakhir</option>
            <option value="year">Tahun Ini</option>
            <option value="custom_range">Pilih Tanggal (Custom)</option>
          </select>
        </div>
        <div id="customDateRow" style="display:none; gap:10px; align-items:flex-end;">
          <div class="filter-group"><label>Dari Tanggal</label><input type="date" id="startDateInput" class="filter-control" style="padding: 8px; border: 1px solid #ddd; border-radius: 4px;"></div>
          <div class="filter-group"><label>Sampai Tanggal</label><input type="date" id="endDateInput" class="filter-control" style="padding: 8px; border: 1px solid #ddd; border-radius: 4px;"></div>
          <button class="btn-tambah-saldo" style="height:37px;" onclick="loadLedger()">Cari</button>
        </div>
      </div>
      <div class="action-buttons">
        <button class="btn-tambah-saldo" onclick="showTambahSaldo()">+ Tambah Saldo</button>
        <button class="btn-pengeluaran" onclick="showTambahPengeluaran()">- Pengeluaran</button>
        <button class="btn-export" onclick="exportExcel()">Export Excel</button>
        <button class="btn-export" onclick="sendReportEmail('keuangan')" style="background:linear-gradient(135deg,#059669,#10b981); margin-left: 10px;">📧 Kirim ke Email</button>
      </div>
    </div>

    <!-- Ledger Table -->
    <div class="ledger-wrapper">
      <div class="ledger-scroll">
        <table class="ledger-table" id="ledgerTable">
          <thead>
            <tr>
              <th class="text-center" style="width:50px;">No</th>
              <th style="width:110px;">Tanggal</th>
              <th>Keterangan</th>
              <th class="text-right" style="width:150px;">Debit</th>
              <th class="text-right" style="width:150px;">Kredit</th>
              <th class="text-right" style="width:170px;">Saldo</th>
              <th class="text-center" style="width:60px;">Aksi</th>
            </tr>
          </thead>
          <tbody id="ledgerBody">
            <tr>
              <td colspan="7" class="empty-state">
                <p>Memuat data...</p>
              </td>
            </tr>
          </tbody>
          <tfoot id="ledgerFoot">
            <tr>
              <td colspan="3" style="font-weight:800;">TOTAL</td>
              <td class="foot-debit" id="footDebit">Rp 0</td>
              <td class="foot-kredit" id="footKredit">Rp 0</td>
              <td class="foot-saldo" id="footSaldo">Rp 0</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </div>

  <script src="/assets/js/jquery-3.7.1.min.js"></script>
  <script src="/assets/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/sweetalert2.min.js"></script>
  <script>
  // ─── Global State ───────────────────────────────────────────────────────────
  window.activePage = 'keuangan';

  function initFilters() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('startDateInput').value = today;
    document.getElementById('endDateInput').value = today;
  }

  function handleFilterChange() {
    const val = document.getElementById('dateFilterSelect').value;
    const customRow = document.getElementById('customDateRow');
    if (val === 'custom_range') { 
      customRow.style.display='flex'; 
    } else { 
      customRow.style.display='none'; 
      loadLedger(); 
    }
  }

  // ─── Format Rupiah ──────────────────────────────────────────────────────────
  function formatRp(num) {
    if (!num && num !== 0) return 'Rp 0';
    const val = Math.round(num);
    return 'Rp ' + val.toLocaleString('id-ID');
  }

  function formatTanggal(dateStr) {
    if (!dateStr) return '-';
    const d = new Date(dateStr);
    return d.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  // ─── Load Saldo ─────────────────────────────────────────────────────────────
  async function loadSaldo() {
    try {
      const res = await fetch('/kas/saldo?_t=' + Date.now());
      const r = await res.json();
      if (r.success) {
        document.getElementById('saldoUtama').textContent = formatRp(r.data.saldo);
      }
    } catch (e) { console.error('Load saldo error:', e); }
  }

  // ─── Load Ledger ────────────────────────────────────────────────────────────
  async function loadLedger() {
    const filter = document.getElementById('dateFilterSelect').value;
    const start = document.getElementById('startDateInput').value;
    const end = document.getElementById('endDateInput').value;

    let dateLabelText = document.getElementById('dateFilterSelect').options[document.getElementById('dateFilterSelect').selectedIndex].text;
    if (filter === 'custom_range') {
      dateLabelText = `${start} s/d ${end}`;
    }
    document.getElementById('dateLabel').textContent = dateLabelText;

    const tbody = document.getElementById('ledgerBody');
    tbody.innerHTML = '<tr><td colspan="7" class="empty-state"><p>Memuat data...</p></td></tr>';

    try {
      let url = `/kas/ledger?date_filter=${filter}&_t=${Date.now()}`;
      if (filter === 'custom_range' && start && end) {
        url += `&start_date=${start}&end_date=${end}`;
      }

      const res = await fetch(url);
      const r = await res.json();

      if (!r.success) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-state"><p>${r.message}</p></td></tr>`;
        return;
      }

      ledgerData = r.data; // store for export

      const { data, saldo_awal, saldo_akhir, total_debit, total_kredit } = r.data;

      // Update cards
      document.getElementById('totalDebit').textContent = formatRp(total_debit);
      document.getElementById('totalKredit').textContent = formatRp(total_kredit);

      // Update footer
      document.getElementById('footDebit').textContent = formatRp(total_debit);
      document.getElementById('footKredit').textContent = formatRp(total_kredit);
      document.getElementById('footSaldo').textContent = formatRp(saldo_akhir);

      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-state"><p>Belum ada data kas pada periode ${dateLabelText}</p></td></tr>`;
        return;
      }

      let html = '';

      // Saldo awal row
      html += `<tr class="saldo-awal-row">
        <td class="col-no">-</td>
        <td class="col-tanggal">-</td>
        <td class="col-keterangan" style="font-style:italic;">SALDO SEBELUMNYA</td>
        <td class="col-debit"></td>
        <td class="col-kredit"></td>
        <td class="col-saldo">${formatRp(saldo_awal)}</td>
        <td class="col-aksi"></td>
      </tr>`;

      data.forEach((row, i) => {
        const isDebit = row.jenis === 'masuk';
        const rowClass = isDebit ? 'row-debit' : '';

        let aksiHtml = '';
        if (row.is_manual) {
          aksiHtml = `<button class="btn-hapus-entry" onclick="hapusEntry(${row.id})" title="Hapus">HAPUS</button>`;
        }

        html += `<tr class="${rowClass}">
          <td class="col-no">${i + 1}</td>
          <td class="col-tanggal">${formatTanggal(row.tanggal)}</td>
          <td class="col-keterangan">${escapeHtml(row.keterangan)}</td>
          <td class="col-debit">${isDebit ? formatRp(row.jumlah) : ''}</td>
          <td class="col-kredit">${!isDebit ? formatRp(row.jumlah) : ''}</td>
          <td class="col-saldo">${formatRp(row.saldo_setelah)}</td>
          <td class="col-aksi">${aksiHtml}</td>
        </tr>`;
      });

      tbody.innerHTML = html;

    } catch (e) {
      console.error('Load ledger error:', e);
      tbody.innerHTML = '<tr><td colspan="7" class="empty-state"><p>Gagal memuat data</p></td></tr>';
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ─── Tambah Saldo ───────────────────────────────────────────────────────────
  function showTambahSaldo() {
    Swal.fire({
      title: 'Tambah Saldo Kas',
      html: `
        <div style="text-align:left;">
          <div style="margin-bottom:12px;">
            <label style="font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#4a4a4a; display:block; margin-bottom:4px;">Jumlah (Rp)</label>
            <input type="text" id="swalJumlah" class="swal2-input" placeholder="Contoh: 150000000" style="margin:0; width:100%;" oninput="formatSwalRupiah(this)">
          </div>
          <div>
            <label style="font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#4a4a4a; display:block; margin-bottom:4px;">Keterangan</label>
            <input type="text" id="swalKeterangan" class="swal2-input" placeholder="Contoh: TAMBAH SALDO" value="TAMBAH SALDO" style="margin:0; width:100%; text-transform:uppercase;">
          </div>
        </div>
      `,
      showCancelButton: true,
      confirmButtonColor: '#16a34a',
      cancelButtonColor: '#6b7280',
      confirmButtonText: 'Tambah',
      cancelButtonText: 'Batal',
      focusConfirm: false,
      preConfirm: () => {
        const jumlah = parseSwalRupiah(document.getElementById('swalJumlah').value);
        const keterangan = document.getElementById('swalKeterangan').value.trim();
        if (!jumlah || jumlah <= 0) {
          Swal.showValidationMessage('Jumlah harus lebih dari 0');
          return false;
        }
        return { jumlah, keterangan };
      }
    }).then(async (result) => {
      if (result.isConfirmed) {
        try {
          const res = await fetch('/kas/tambah', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(result.value)
          });
          const r = await res.json();
          if (r.success) {
            Swal.fire({ icon: 'success', title: 'Berhasil', text: r.message, timer: 2000, showConfirmButton: false });
            loadLedger();
            loadSaldo();
          } else {
            Swal.fire({ icon: 'error', title: 'Gagal', text: r.message });
          }
        } catch (e) {
          Swal.fire({ icon: 'error', title: 'Error', text: 'Gagal menambah saldo' });
        }
      }
    });
  }

  // ─── Tambah Pengeluaran ─────────────────────────────────────────────────────
  function showTambahPengeluaran() {
    Swal.fire({
      title: 'Catat Pengeluaran',
      html: `
        <div style="text-align:left;">
          <div style="margin-bottom:12px;">
            <label style="font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#4a4a4a; display:block; margin-bottom:4px;">Keterangan</label>
            <input type="text" id="swalKetPengeluaran" class="swal2-input" placeholder="Contoh: UANG JALAN GALUH" style="margin:0; width:100%; text-transform:uppercase;">
          </div>
          <div>
            <label style="font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#4a4a4a; display:block; margin-bottom:4px;">Jumlah (Rp)</label>
            <input type="text" id="swalJmlPengeluaran" class="swal2-input" placeholder="Contoh: 550000" style="margin:0; width:100%;" oninput="formatSwalRupiah(this)">
          </div>
        </div>
      `,
      showCancelButton: true,
      confirmButtonColor: '#dc2626',
      cancelButtonColor: '#6b7280',
      confirmButtonText: 'Catat Pengeluaran',
      cancelButtonText: 'Batal',
      focusConfirm: false,
      preConfirm: () => {
        const keterangan = document.getElementById('swalKetPengeluaran').value.trim();
        const jumlah = parseSwalRupiah(document.getElementById('swalJmlPengeluaran').value);
        if (!keterangan) {
          Swal.showValidationMessage('Keterangan harus diisi');
          return false;
        }
        if (!jumlah || jumlah <= 0) {
          Swal.showValidationMessage('Jumlah harus lebih dari 0');
          return false;
        }
        return { jumlah, keterangan };
      }
    }).then(async (result) => {
      if (result.isConfirmed) {
        try {
          const res = await fetch('/kas/pengeluaran', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(result.value)
          });
          const r = await res.json();
          if (r.success) {
            Swal.fire({ icon: 'success', title: 'Berhasil', text: r.message, timer: 2000, showConfirmButton: false });
            loadLedger();
            loadSaldo();
          } else {
            Swal.fire({ icon: 'error', title: 'Gagal', text: r.message });
          }
        } catch (e) {
          Swal.fire({ icon: 'error', title: 'Error', text: 'Gagal mencatat pengeluaran' });
        }
      }
    });
  }

  // ─── Hapus Entry ────────────────────────────────────────────────────────────
  async function hapusEntry(id) {
    const result = await Swal.fire({
      title: 'Hapus entry ini?',
      text: 'Entry akan dihapus dan saldo akan dihitung ulang',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#dc2626',
      cancelButtonColor: '#6b7280',
      confirmButtonText: 'Ya, Hapus',
      cancelButtonText: 'Batal'
    });

    if (result.isConfirmed) {
      try {
        const res = await fetch(`/kas/hapus/${id}`, { method: 'DELETE' });
        const r = await res.json();
        if (r.success) {
          Swal.fire({ icon: 'success', title: 'Dihapus', text: 'Entry berhasil dihapus', timer: 1500, showConfirmButton: false });
          loadLedger();
          loadSaldo();
        } else {
          Swal.fire({ icon: 'error', title: 'Gagal', text: r.message });
        }
      } catch (e) {
        Swal.fire({ icon: 'error', title: 'Error', text: 'Gagal menghapus entry' });
      }
    }
  }

  // ─── Export Excel ───────────────────────────────────────────────────────────
  function exportExcel() {
    if (!ledgerData || !ledgerData.data || ledgerData.data.length === 0) {
      Swal.fire({ icon: 'warning', title: 'Kosong', text: 'Tidak ada data untuk di-export' });
      return;
    }

    let dateLabelText = document.getElementById('dateFilterSelect').options[document.getElementById('dateFilterSelect').selectedIndex].text;
    if (ledgerData.date_filter === 'custom_range') {
      dateLabelText = `${ledgerData.start_date} s/d ${ledgerData.end_date}`;
    }
    const { data, saldo_awal, saldo_akhir, total_debit, total_kredit } = ledgerData;

    const formatRupiahVal = (val) => {
      if (val === undefined || val === null || val === '') return 'Rp 0';
      const num = parseFloat(val);
      if (isNaN(num)) return 'Rp 0';
      return 'Rp ' + new Intl.NumberFormat('id-ID').format(num);
    };

    // Build HTML table for Excel
    let html = `
    <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">
    <head><meta charset="UTF-8">
    <style>
      td, th { font-family: Arial; font-size: 11px; border: 1px solid #000; padding: 5px 8px; }
      th { background: #1a1a1a; color: #fff; font-weight: bold; text-align: center; }
      .title { font-size: 16px; font-weight: bold; border: none; text-align: center; }
      .subtitle { font-size: 12px; border: none; text-align: center; color: #666; }
      .debit { color: #16a34a; font-weight: bold; }
      .kredit { color: #dc2626; font-weight: bold; }
      .saldo { font-weight: bold; }
      .total-row td { background: #f0f0f0; font-weight: bold; font-size: 12px; }
      .saldo-awal td { background: #fefce8; font-style: italic; }
      .right { text-align: right; }
      .center { text-align: center; }
      .currency-format { text-align: right; white-space: nowrap; }
    </style>
    </head><body>
    <table>
      <tr><td colspan="6" class="title">KEUANGAN PERIODE: ${dateLabelText.toUpperCase()}</td></tr>
      <tr><td colspan="6" class="subtitle">Dicetak: ${new Date().toLocaleDateString('id-ID')} ${new Date().toLocaleTimeString('id-ID')}</td></tr>
      <tr><td colspan="6"></td></tr>
      <tr>
        <th style="width:40px;">NO</th>
        <th style="width:90px;">TANGGAL</th>
        <th style="width:250px;">KETERANGAN</th>
        <th style="width:120px;">DEBIT</th>
        <th style="width:120px;">KREDIT</th>
        <th style="width:140px;">SALDO</th>
      </tr>
      <tr class="saldo-awal">
        <td class="center">-</td>
        <td>-</td>
        <td>SALDO SEBELUMNYA</td>
        <td></td>
        <td></td>
        <td class="currency-format saldo">${formatRupiahVal(saldo_awal)}</td>
      </tr>`;

    data.forEach((row, i) => {
      const isDebit = row.jenis === 'masuk';
      html += `<tr>
        <td class="center">${i + 1}</td>
        <td>${formatTanggal(row.tanggal)}</td>
        <td>${escapeHtml(row.keterangan)}</td>
        <td class="currency-format ${isDebit ? 'debit' : ''}">${isDebit ? formatRupiahVal(row.jumlah) : ''}</td>
        <td class="currency-format ${!isDebit ? 'kredit' : ''}">${!isDebit ? formatRupiahVal(row.jumlah) : ''}</td>
        <td class="currency-format saldo">${formatRupiahVal(row.saldo_setelah)}</td>
      </tr>`;
    });

    html += `
      <tr class="total-row">
        <td colspan="3" style="font-weight:bold;">TOTAL</td>
        <td class="currency-format debit">${formatRupiahVal(total_debit)}</td>
        <td class="currency-format kredit">${formatRupiahVal(total_kredit)}</td>
        <td class="currency-format saldo">${formatRupiahVal(saldo_akhir)}</td>
      </tr>
    </table>
    </body>
    </html>`;

    // Download
    const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Keuangan_${dateLabelText.replace(/[\/\\]/g, '-')}.xls`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function sendReportEmail(reportType) {
    const { value: email } = await Swal.fire({
      title: '📧 Kirim Laporan ke Email',
      html: `<input id="swalEmailInput" class="swal2-input" placeholder="email_tujuan@gmail.com" type="email">
             <select id="swalReportType" class="swal2-select" style="margin-top:10px;">
               <option value="keuangan">Laporan Keuangan / Kas</option>
               <option value="transaksi">Laporan Transaksi Timbangan</option>
               <option value="semua">Semua Laporan</option>
               <option value="pengiriman">Laporan Timbangan Jual</option>
             </select>`,
      focusConfirm: false,
      showCancelButton: true,
      confirmButtonText: 'Kirim',
      confirmButtonColor: '#059669',
      cancelButtonText: 'Batal',
      preConfirm: () => {
        const emailVal = document.getElementById('swalEmailInput').value.trim();
        if (!emailVal) { Swal.showValidationMessage('Masukkan alamat email tujuan'); return false; }
        return {
          email: emailVal,
          type: document.getElementById('swalReportType').value
        };
      }
    });
    if (!email) return;

    Swal.fire({ title: 'Mengirim laporan...', text: 'Mohon tunggu sebentar', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

    const filter = document.getElementById('dateFilterSelect').value;
    const start = document.getElementById('startDateInput').value;
    const end = document.getElementById('endDateInput').value;

    try {
      const res = await fetch('/setup/send-report-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          recipient: email.email,
          report_type: email.type,
          date_filter: filter,
          start_date: start,
          end_date: end
        })
      });
      const r = await res.json();
      if (r.success) {
        Swal.fire({ icon: 'success', title: 'Terkirim!', text: r.message, timer: 3000, showConfirmButton: true });
      } else {
        Swal.fire({ icon: 'error', title: 'Gagal', text: r.message });
      }
    } catch (e) {
      Swal.fire({ icon: 'error', title: 'Error', text: 'Gagal mengirim: ' + e.message });
    }
  }

  // ─── Rupiah Input Helpers ───────────────────────────────────────────────────
  function formatSwalRupiah(el) {
    let value = el.value.replace(/[^0-9]/g, '');
    if (value) {
      el.value = parseInt(value).toLocaleString('id-ID');
    }
  }

  function parseSwalRupiah(str) {
    if (!str) return 0;
    return parseInt(str.replace(/[^0-9]/g, '')) || 0;
  }

  document.addEventListener('DOMContentLoaded', async function() {
    await loadSessionInfo();
    initFilters();
    await loadLedger();
    await loadSaldo();
  });
  </script>
  <script src="/js/sidebar.js"></script>
</body>
</html>
