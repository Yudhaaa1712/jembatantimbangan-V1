<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Hutang</title>
  <link rel="stylesheet" href="/assets/css/print.css">
</head>

<body class="receipt-screen">
  <div class="receipt-container">
    <pre id="isiStruk">Memuat data...</pre>
  </div>
  <button class="print-btn no-print" onclick="window.print()">Cetak</button>

  <script src="/js/print-struk.js"></script>
  <script>
    // Kartu piutang memakai kerangka struk yang sama dengan nota timbangan:
    // ukuran kertas, lebar kolom, font, dan kop semuanya dari Pengaturan.
    async function load() {
      const P = await StrukPrinter.init();

      // /hutang-print/:type/:id
      const parts = window.location.pathname.split('/').filter(Boolean);
      const type = decodeURIComponent(parts[1] || '');
      const id = parts[2] || '';

      let det = null, his = [];
      try {
        const [d, h] = await Promise.all([
          fetch(`/hutang/${type}/detail/${id}`).then(r => r.json()),
          fetch(`/hutang/${type}/history/${id}`).then(r => r.json())
        ]);
        if (d.success) det = d.data;
        if (h.success) his = h.data || [];
      } catch (e) { console.error('[Hutang]', e); }

      if (!det) {
        document.getElementById('isiStruk').textContent = 'Data tidak ditemukan';
        return;
      }

      const p = det.party;
      const label = det.label || type;

      let out = P.kop('Riwayat Hutang ' + label);
      out += P.baris('Nama', (p.nama || '-').toUpperCase()) + '\n';
      out += P.baris('Kategori', label) + '\n';
      if (p.no_telepon) out += P.baris('No. HP', p.no_telepon) + '\n';
      if (p.alamat) out += P.baris('Alamat', p.alamat) + '\n';
      out += P.baris('Status', p.status === 'active' ? 'Aktif' : 'Nonaktif') + '\n';
      out += P.baris('Tgl Cetak', new Date().toLocaleDateString('id-ID')) + '\n';
      out += P.garis('=') + '\n';

      // Urut lama → baru supaya saldo berjalan terbaca menurun ke bawah.
      const data = his.slice().reverse();
      const sumberMap = { manual: 'Manual', timbangan: 'Timbangan', gaji: 'Gaji' };
      let totalPinjam = 0, totalBayar = 0;

      if (!data.length) {
        out += P.tengah('Belum ada riwayat') + '\n';
      } else {
        data.forEach((h, i) => {
          const pinjam = h.jenis === 'tambah' ? parseFloat(h.jumlah || 0) : 0;
          const bayar = h.jenis === 'bayar' ? parseFloat(h.jumlah || 0) : 0;
          totalPinjam += pinjam;
          totalBayar += bayar;

          const tgl = h.tanggal ? new Date(h.tanggal).toLocaleDateString('id-ID') : '-';
          out += `${i + 1}. ${tgl}  [${sumberMap[h.sumber] || (h.sumber || '-')}]\n`;
          if (h.keterangan) {
            P.wrapText(h.keterangan, P.W - 3).forEach(b => { out += '   ' + b + '\n'; });
          }
          if (pinjam > 0) out += P.barisKanan('   Pinjam', P.rp(pinjam)) + '\n';
          if (bayar > 0) out += P.barisKanan('   Bayar', P.rp(bayar)) + '\n';
          out += P.barisKanan('   Sisa', P.rp(h.saldo_setelah)) + '\n';
          out += P.garis('-') + '\n';
        });
      }

      out += P.barisKanan('TOTAL PINJAMAN', P.rp(totalPinjam)) + '\n';
      out += P.barisKanan('TOTAL PEMBAYARAN', P.rp(totalBayar)) + '\n';
      out += P.garis('=') + '\n';
      out += P.barisKanan('SISA HUTANG', P.rp(p.total_hutang)) + '\n';
      out += P.garis('=') + '\n';
      out += P.tandaTangan('Yang Berhutang', (p.nama || '').toUpperCase(), 'Hormat Kami', '');

      P.render(out);
    }
    document.addEventListener('DOMContentLoaded', load);
  </script>
</body>

</html>
