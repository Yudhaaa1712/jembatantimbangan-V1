<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timbangan Masuk - Weighbridge Arroyan</title>
  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="stylesheet" href="/assets/css/sweetalert2.min.css">
</head>

<body class="page-weigh">
  <!-- Header -->
  <div id="site-header"></div>

  <div class="w-full px-4 h-screen py-2 max-h-[100vh] overflow-hidden">
    <div class="grid grid-cols-12 gap-6 h-full">
      <div class="col-span-12">
        <div class="card border-0 bg-ink text-slate-300 shadow-lg h-full">
          <div class="card-header border-0 py-2">
            <div class="flex items-center justify-between">
              <div>
                <h4 class="mb-0 text-white"><svg class="icon" aria-hidden="true">
                    <use href="#i-speedometer2"></use>
                  </svg> TIMBANGAN MASUK (BRUTO)</h4>
              </div>
              <div class="text-right flex items-center gap-2">
                <div class="badge bg-ink-600" id="serialConfigStatus">
                  <svg class="icon" aria-hidden="true">
                    <use href="#i-plug-fill"></use>
                  </svg> <span id="currentBaudRate">9600</span>
                </div>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="openSerialSettings"
                  title="Pengaturan Port">
                  <svg class="icon" aria-hidden="true">
                    <use href="#i-gear-fill"></use>
                  </svg> Pengaturan
                </button>
              </div>
            </div>
          </div>

          <div class="card-body p-4 overflow-y-auto max-h-[calc(100vh-80px)]">
            <div id="alertContainer"></div>

            <form method="POST" id="timbangan1Form" data-formnav>
              <div class="grid grid-cols-12 gap-4">
                <div class="col-span-12">
                  <div class="grid grid-cols-12 gap-4">
                    <!-- Form Fields -->
                    <div class="col-span-12 md:col-span-8">
                      <div class="grid grid-cols-12 gap-4">
                        <!-- Mode timbangan selalu 'beli' — penjualan lewat menu Pengiriman Pabrik -->

                        <!-- Mode Langsir -->
                        <div class="col-span-12 mb-2" id="field_langsir">
                          <div class="form-check form-switch">
                            <input class="form-check-input [transform:scale(1.2)] cursor-pointer" type="checkbox"
                              name="is_langsir" id="isLangsir" value="1">
                            <label class="form-check-label ml-2 text-amber-500 font-bold cursor-pointer"
                              for="isLangsir">
                              <svg class="icon" aria-hidden="true">
                                <use href="#i-truck-flatbed"></use>
                              </svg> MODE LANGSIR (Timbang Berkali-kali)
                            </label>
                          </div>
                          <div id="langsirInfo" class="alert alert-info py-1 px-2 mt-2 mb-0 text-sm font-bold"
                            style="display:none"></div>
                        </div>

                        <!-- Semua Field -->
                        <div class="col-span-12 md:col-span-6 mb-4" id="field_no_kendaraan">
                          <label class="form-label text-red-600">Nomor Kendaraan</label>
                          <input type="text" name="no_kendaraan" id="noKendaraanInput" class="form-control uppercase">
                        </div>
                        <div class="col-span-12 md:col-span-6 mb-4" id="field_nama_pengemudi">
                          <label class="form-label text-red-600">Nama Pengemudi</label>
                          <input type="text" name="nama_pengemudi" id="namaPengemudiInput"
                            class="form-control uppercase">
                          <div id="supirHutangWarning" class="text-amber-500 text-sm mt-1 font-bold"
                            style="display:none"></div>
                        </div>
                        <div class="col-span-12 md:col-span-6 mb-4" id="field_nama_suplier">
                          <label class="form-label text-red-600">Nama Suplier</label>
                          <input type="text" name="nama_suplier" id="supplierInput" class="form-control uppercase"
                            list="supplierList" autocomplete="off">
                          <datalist id="supplierList"></datalist>
                          <div id="supplierValidationText" class="text-sm mt-1 font-bold" style="display:none"></div>
                        </div>
                        <div class="col-span-12 md:col-span-6 mb-4" id="field_material">
                          <label class="form-label text-red-600">Jenis Material</label>
                          <select id="materialSelect" class="form-select">
                            <!-- populated dynamically -->
                          </select>
                          <div class="mt-2">
                            <input type="text" id="newMaterialInput" class="form-control form-control-sm uppercase"
                              placeholder="+ Tambah & Gunakan Material Baru..." autocomplete="off">
                          </div>
                        </div>
                        <div class="col-span-12 md:col-span-6 mb-4" id="field_harga">
                          <label class="form-label text-red-600">Harga per Kg</label>
                          <input type="text" name="harga_display" class="form-control rupiah-input" id="hargaInput"
                            placeholder="0">
                          <input type="hidden" name="harga" id="hargaHidden" value="0">
                        </div>
                        <div class="col-span-12 md:col-span-6 mb-4" id="field_keterangan">
                          <label class="form-label text-red-600"><svg class="icon" aria-hidden="true">
                              <use href="#i-chat-left-text"></use>
                            </svg> Keterangan</label>
                          <input type="text" class="form-control uppercase" name="keterangan">
                        </div>
                      </div>
                    </div>

                    <!-- Display Panel -->
                    <div class="col-span-12 md:col-span-4">
                      <div class="card h-full">
                        <label class="form-label"><svg class="icon" aria-hidden="true">
                            <use href="#i-display"></use>
                          </svg> DISPLAY TIMBANGAN</label>
                        <div class="display-panel">
                          <div class="display-value" id="weightDisplay">0 KG</div>
                          <div class="display-status" id="weightStatus">Menunggu koneksi...</div>
                          <button type="button" class="btn btn-info w-full mt-4" id="toggleConnection">
                            <svg class="icon" aria-hidden="true">
                              <use href="#i-plug-fill"></use>
                            </svg> SAMBUNGKAN
                          </button>
                          <button type="button" class="btn btn-warning w-full mt-2" id="captureWeight">
                            <svg class="icon" aria-hidden="true">
                              <use href="#i-camera-fill"></use>
                            </svg> AMBIL BERAT
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- Berat & Buttons -->
                  <div class="grid grid-cols-12 gap-4 mt-2">
                    <div class="col-span-12 md:col-span-4">
                      <label
                        class="form-label text-[white] py-[12px] px-[16px] rounded-[12px12px00] mb-0 text-center font-bold block">
                        BERAT TERTANGKAP
                      </label>
                      <input type="number" class="form-control" name="berat" id="beratInputForm" value="" step="1"
                        min="0" placeholder="">
                    </div>
                    <div class="col-span-12 md:col-span-8 flex items-end">
                      <div class="flex gap-2 w-full">
                        <button type="submit" class="btn btn-success flex-1" id="btnSimpan">
                          <svg class="icon" aria-hidden="true">
                            <use href="#i-save-fill"></use>
                          </svg> <span id="btnSimpanText">SIMPAN DATA</span>
                        </button>
                        <button type="reset" class="btn btn-outline-warning flex-1" id="btnReset">
                          <svg class="icon" aria-hidden="true">
                            <use href="#i-arrow-counterclockwise"></use>
                          </svg> RESET
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Serial Settings Modal -->
  <div class="modal" id="serialSettingsModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content bg-ink text-slate-300">
        <div class="modal-header">
          <h5 class="modal-title"><svg class="icon" aria-hidden="true">
              <use href="#i-gear-fill"></use>
            </svg> Pengaturan Port Serial</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-4">
            <label class="form-label">Baud Rate</label>
            <select class="form-select" id="baudRateSelect">
              <option value="1200">1200</option>
              <option value="2400">2400</option>
              <option value="4800">4800</option>
              <option value="9600" selected>9600</option>
              <option value="19200">19200</option>
              <option value="38400">38400</option>
              <option value="57600">57600</option>
              <option value="115200">115200</option>
            </select>
          </div>
          <div id="portInfo" class="text-slate-400 text-sm"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-light" data-bs-dismiss="modal">Tutup</button>
          <button class="btn btn-primary" id="saveBaudRate">Simpan</button>
          <button class="btn btn-danger" id="forgetPort">Lupakan Port</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/assets/js/jquery-3.7.1.min.js"></script>
  <script src="/assets/js/sweetalert2.min.js"></script>
  <script src="/js/auto-serial-connect.js" defer></script>
  <script src="/js/form-nav.js" defer></script>

  <script>
    // ─── Session Info ──────────────────────────────────────────────────────────
    window.activePage = 'timbangan1';
    let allSuppliers = [];

    async function loadSuppliers() {
      try {
        const res = await fetch('/timbangan/data?_t=' + Date.now());
        const data = await res.json();
        if (data.success) {
          allSuppliers = data.data.suppliers || [];
          const dl = document.getElementById('supplierList');
          if (dl) {
            dl.innerHTML = '';
            allSuppliers.forEach(s => {
              const opt = document.createElement('option');
              opt.value = s.nama_supplier;
              dl.appendChild(opt);
            });
          }
          // Populate material options into select
          const sel = document.getElementById('materialSelect');
          if (sel) {
            sel.innerHTML = '';
            let materialsList = data.data.materials || ['tbs', 'brondolan'];
            if (typeof materialsList === 'string') {
              try { materialsList = JSON.parse(materialsList); } catch (e) { }
            }
            if (!Array.isArray(materialsList)) materialsList = ['tbs', 'brondolan'];
            materialsList.forEach(m => {
              const opt = document.createElement('option');
              opt.value = m.toLowerCase();
              opt.textContent = m.toUpperCase();
              sel.appendChild(opt);
            });
          }

          // Default material to tbs if currently empty
          const selEl = document.getElementById('materialSelect');
          if (selEl && !selEl.value) {
            selEl.value = 'tbs';
          }
        }
      } catch (e) { console.warn('Load suppliers error:', e); }
    }

    // ─── Load Drivers for datalist & Check Debt ──────────────────────────────
    async function loadDrivers() {
      // Autocomplete dropdown suggestions disabled by request
    }

    // ─── Load Field Settings (Custom fields per RAM) ────────────────────────────
    let isHutangActive = false;
    async function loadFieldSettings() {
      try {
        const res = await fetch('/setup/settings');
        const r = await res.json();
        if (r.success) {
          if (r.data.active_features) {
            try {
              const features = JSON.parse(r.data.active_features);
              isHutangActive = features.hutang === true;
            } catch (e) { }
          }

          if (r.data.timbangan1_fields) {
            const fields = JSON.parse(r.data.timbangan1_fields);
            window.t1Fields = fields;
            const fieldMap = {
              no_kendaraan: 'field_no_kendaraan',
              nama_pengemudi: 'field_nama_pengemudi',
              nama_suplier: 'field_nama_suplier',
              material: 'field_material',
              harga: 'field_harga',
              keterangan: 'field_keterangan'
            };
            Object.keys(fieldMap).forEach(key => {
              const el = document.getElementById(fieldMap[key]);
              if (!el) return;
              if (fields[key] === false) {
                el.style.display = 'none';
                // Remove required & clear value from hidden inputs
                el.querySelectorAll('input, select, textarea').forEach(inp => {
                  inp.removeAttribute('required');
                  if (inp.type !== 'hidden') inp.value = '';
                });
              } else {
                // Restore visible
                el.style.display = '';
              }
            });
          }
        }
      } catch (e) { console.warn('Load field settings error:', e); }
    }

    // ─── Check Driver Debt on Input ──────────────────────────────────────────
    let hutangTimeout = null;
    document.getElementById('namaPengemudiInput').addEventListener('input', function () {
      if (!isHutangActive) return;
      const name = this.value.trim();
      const warningEl = document.getElementById('supirHutangWarning');
      if (!name) {
        warningEl.style.display = 'none';
        return;
      }
      clearTimeout(hutangTimeout);
      hutangTimeout = setTimeout(async () => {
        try {
          const res = await fetch('/hutang-supir-api/supir/check-debt?name=' + encodeURIComponent(name));
          const data = await res.json();
          if (data.success && data.data && data.data.total_hutang > 0) {
            warningEl.textContent = `⚠️ Supir ini memiliki sisa hutang: ${new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(data.data.total_hutang)}`;
            warningEl.style.display = 'block';
          } else {
            warningEl.style.display = 'none';
          }
        } catch (e) {
          warningEl.style.display = 'none';
        }
      }, 400);
    });

    // ─── Mode Langsir ─────────────────────────────────────────────────────────
    let pendingLangsirTxId = null;
    let pendingTripCount = 0;

    function langsirInfoEl() { return document.getElementById('langsirInfo'); }

    // Deteksi otomatis tiket langsir berjalan berdasarkan plat / nama supir yang diketik.
    // Berjalan tiap kali field diketik — tidak perlu mengaktifkan toggle lebih dulu.
    function checkOngoingLangsir() {
      const plate = document.getElementById('noKendaraanInput').value.trim().toUpperCase();
      const supir = document.getElementById('namaPengemudiInput').value.trim().toUpperCase();
      const supplier = document.getElementById('supplierInput').value.trim().toUpperCase();

      if (!plate && !supir && !supplier) { clearAutoLangsir(); return; }

      fetch('/timbangan/ajax', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'get_pending_tickets' })
      }).then(r => r.json()).then(res => {
        const activeTx = (res.success && res.data) ? res.data.find(t => {
          if (t.is_langsir !== 1) return false;
          const mP = plate && t.no_polisi && t.no_polisi.toUpperCase() === plate;
          const mS = supir && t.nama_supir && t.nama_supir.toUpperCase() === supir;
          const mSup = supplier && t.nama_supplier && t.nama_supplier.toUpperCase() === supplier;
          return mP || mS || mSup;
        }) : null;

        if (activeTx) {
          pendingLangsirTxId = activeTx.id;
          pendingTripCount = activeTx.jumlah_trip_langsir || 1;

          document.getElementById('isLangsir').checked = true;
          document.getElementById('isLangsir').disabled = true; // tidak boleh dimatikan di tengah langsir

          if (!document.getElementById('noKendaraanInput').value.trim() && activeTx.no_polisi) document.getElementById('noKendaraanInput').value = activeTx.no_polisi;
          if (!document.getElementById('namaPengemudiInput').value.trim() && activeTx.nama_supir) document.getElementById('namaPengemudiInput').value = activeTx.nama_supir;
          if (!document.getElementById('supplierInput').value.trim() && activeTx.nama_supplier) document.getElementById('supplierInput').value = activeTx.nama_supplier;

          langsirInfoEl().innerHTML = `<svg class="icon" aria-hidden="true"><use href="#i-truck-flatbed"></use></svg> MODE LANGSIR BERJALAN — ${activeTx.no_polisi || '-'} • Supir: ${activeTx.nama_supir || '-'} • Trip ke-${pendingTripCount + 1}. Yang disimpan di sini adalah BRUTO trip ini; taranya ditimbang di Timbangan Keluar saat mobil pulang kosong.`;
          langsirInfoEl().style.display = 'block';
          document.getElementById('btnSimpanText').textContent = `TAMBAH TRIP LANGSIR (Trip ke-${pendingTripCount + 1})`;
        } else {
          clearAutoLangsir();
        }
      }).catch(e => console.error(e));
    }

    // Reset khusus hasil deteksi-otomatis; hormati pilihan manual toggle.
    function clearAutoLangsir() {
      pendingLangsirTxId = null;
      pendingTripCount = 0;
      const cb = document.getElementById('isLangsir');
      cb.disabled = false;
      document.getElementById('btnSimpanText').textContent = 'SIMPAN DATA';
      if (cb.checked) {
        // toggle masih dinyalakan manual → tampilkan keterangan mode aktif
        langsirInfoEl().innerHTML = '<svg class="icon" aria-hidden="true"><use href="#i-truck-flatbed"></use></svg> MODE LANGSIR AKTIF — timbangan dengan kendaraan/supir yang sama akan menambah trip bruto.';
        langsirInfoEl().style.display = 'block';
      } else {
        langsirInfoEl().style.display = 'none';
      }
    }

    document.getElementById('noKendaraanInput').addEventListener('input', checkOngoingLangsir);
    document.getElementById('namaPengemudiInput').addEventListener('input', checkOngoingLangsir);
    document.getElementById('supplierInput').addEventListener('input', checkOngoingLangsir);

    // Toggle manual: ON → tampilkan pemberitahuan (dan cek tiket berjalan); OFF → hilang
    document.getElementById('isLangsir').addEventListener('change', function () {
      if (this.checked) {
        langsirInfoEl().innerHTML = '<svg class="icon" aria-hidden="true"><use href="#i-truck-flatbed"></use></svg> MODE LANGSIR AKTIF — timbangan dengan kendaraan/supir yang sama akan menambah trip bruto.';
        langsirInfoEl().style.display = 'block';
        checkOngoingLangsir();
      } else {
        resetLangsirUI();
      }
    });

    // Reset penuh (dipakai setelah simpan / reset form)
    function resetLangsirUI() {
      pendingLangsirTxId = null;
      pendingTripCount = 0;
      const cb = document.getElementById('isLangsir');
      cb.disabled = false;
      cb.checked = false;
      langsirInfoEl().style.display = 'none';
      document.getElementById('btnSimpanText').textContent = 'SIMPAN DATA';
    }

    document.getElementById('supplierInput').addEventListener('input', function () {
      const val = this.value.trim().toUpperCase();
      const validationEl = document.getElementById('supplierValidationText');
      const hargaInput = document.getElementById('hargaInput');
      const hargaHidden = document.getElementById('hargaHidden');
      const fieldHarga = document.getElementById('field_harga');

      if (!val) {
        validationEl.style.display = 'none';
        if (fieldHarga) fieldHarga.style.display = (window.t1Fields && window.t1Fields.harga === false) ? 'none' : '';
        return;
      }

      const matchedSupplier = allSuppliers.find(s => s.nama_supplier.toUpperCase() === val);
      if (matchedSupplier) {
        // Auto-fill price
        const price = matchedSupplier.default_harga || 0;
        hargaHidden.value = price;
        hargaInput.value = new Intl.NumberFormat('id-ID').format(price);

        // Display validation info (small green text, or red if has debt)
        let infoText = `Harga = Rp ${new Intl.NumberFormat('id-ID').format(price)} | Potongan = ${matchedSupplier.default_potongan || 0}%`;
        if (matchedSupplier.total_hutang && parseFloat(matchedSupplier.total_hutang) > 0) {
          infoText += ` | ⚠️ Sisa Hutang: Rp ${new Intl.NumberFormat('id-ID').format(matchedSupplier.total_hutang)}`;
          validationEl.className = 'small mt-1 text-danger';
        } else {
          validationEl.className = 'small mt-1 text-success';
        }
        validationEl.textContent = infoText;
        validationEl.style.display = 'block';
        if (fieldHarga) fieldHarga.style.display = '';
      } else {
        // Unregistered supplier -> do nothing (hide validation element)
        validationEl.style.display = 'none';
        if (fieldHarga) fieldHarga.style.display = (window.t1Fields && window.t1Fields.harga === false) ? 'none' : '';
      }
    });

    // ─── Form Submit ───────────────────────────────────────────────────────────
    let isWeightLocked = false;

    document.getElementById('timbangan1Form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = document.getElementById('btnSimpan');
      btn.disabled = true;
      btn.innerHTML = '<svg class="icon" aria-hidden="true"><use href="#i-hourglass-split"></use></svg> Menyimpan...';

      try {
        const formData = new FormData(this);
        const selectVal = document.getElementById('materialSelect').value;
        const newMatVal = document.getElementById('newMaterialInput').value.trim().toLowerCase();
        const materialVal = newMatVal ? newMatVal : selectVal;

        const payload = {
          no_kendaraan: formData.get('no_kendaraan'),
          nama_pengemudi: formData.get('nama_pengemudi'),
          nama_suplier: formData.get('nama_suplier'),
          material: materialVal,
          harga: formData.get('harga') || '0',
          berat: formData.get('berat'),
          keterangan: formData.get('keterangan') || '',
          mode_timbangan: 'beli' // mode jual dihapus — penjualan lewat menu Pengiriman Pabrik
        };

        if (pendingLangsirTxId) {
          payload.action = 'append_langsir_trip';
          payload.id_transaksi = pendingLangsirTxId;
          payload.berat_timbangan1 = payload.berat;
          // Plat & supir dikirim per trip: mobil boleh berganti antar trip, dan
          // tara nanti dipotong per mobil masing-masing.
          payload.no_polisi = payload.no_kendaraan;
          payload.nama_supir = payload.nama_pengemudi;

          const res = await fetch('/timbangan/ajax', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const result = await res.json();
          handleSaveResponse(result);
        } else {
          payload.is_langsir = document.getElementById('isLangsir').checked ? 1 : 0;
          const res = await fetch('/timbangan/save-timbangan1', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const result = await res.json();
          handleSaveResponse(result);
        }

        function handleSaveResponse(result) {
          if (result.success) {
            Swal.fire({
              icon: 'success',
              title: 'Berhasil!',
              text: result.message,
              timer: 2000,
              showConfirmButton: false
            }).then(() => {
              document.getElementById('timbangan1Form').reset();
              document.getElementById('newMaterialInput').value = '';
              loadSuppliers(); // Reload lists to include the newly added material in the dropdown
              document.getElementById('weightDisplay').textContent = '0 KG';
              isWeightLocked = false;
              window.isWeightLocked = false;
              document.getElementById('supirHutangWarning').style.display = 'none';
              document.getElementById('supplierValidationText').style.display = 'none';
              resetLangsirUI();
            });
          } else {
            Swal.fire({ icon: 'error', title: 'Gagal', text: result.message });
          }
        }
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Error', text: 'Gagal menyimpan data' });
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<svg class="icon" aria-hidden="true"><use href="#i-save-fill"></use></svg> SIMPAN DATA';
      }
    });

    // ─── Rupiah Formatting ─────────────────────────────────────────────────────
    document.getElementById('hargaInput').addEventListener('input', function () {
      const val = this.value.replace(/[^0-9]/g, '');
      document.getElementById('hargaHidden').value = val;
      if (val) this.value = new Intl.NumberFormat('id-ID').format(parseInt(val));
    });

    // ─── Capture Weight ────────────────────────────────────────────────────────
    document.getElementById('captureWeight').addEventListener('click', function () {
      const display = document.getElementById('weightDisplay');
      const weight = parseInt(display.dataset.rawWeight) || 0;
      if (weight > 0) {
        document.getElementById('beratInputForm').value = weight;
        isWeightLocked = true;
        window.isWeightLocked = true;
        this.innerHTML = '<svg class="icon" aria-hidden="true"><use href="#i-lock-fill"></use></svg> TERKUNCI';
        this.className = 'btn btn-success w-full mt-2';
      } else {
        Swal.fire({ icon: 'warning', title: 'Perhatian', text: 'Belum ada berat dari timbangan' });
      }
    });

    // Reset unlock
    document.getElementById('btnReset').addEventListener('click', function () {
      isWeightLocked = false;
      window.isWeightLocked = false;
      document.getElementById('captureWeight').innerHTML = '<svg class="icon" aria-hidden="true"><use href="#i-camera-fill"></use></svg> AMBIL BERAT';
      document.getElementById('captureWeight').className = 'btn btn-warning w-full mt-2';
      document.getElementById('weightDisplay').textContent = '0 KG';
      document.getElementById('supirHutangWarning').style.display = 'none';
      document.getElementById('supplierValidationText').style.display = 'none';
      document.getElementById('isLangsir').checked = false;
      resetLangsirUI();
    });

    // ─── Serial Settings Modal ─────────────────────────────────────────────────
    document.getElementById('openSerialSettings').addEventListener('click', function () {
      const modal = new bootstrap.Modal(document.getElementById('serialSettingsModal'));
      const saved = localStorage.getItem('serialBaudRate');
      if (saved) document.getElementById('baudRateSelect').value = saved;
      modal.show();
    });

    document.getElementById('saveBaudRate').addEventListener('click', function () {
      const baud = parseInt(document.getElementById('baudRateSelect').value);
      localStorage.setItem('serialBaudRate', baud);
      document.getElementById('currentBaudRate').textContent = baud;
      if (window.serialConnector) window.serialConnector.updateBaudRate(baud);
      bootstrap.Modal.getInstance(document.getElementById('serialSettingsModal')).hide();
      Swal.fire({ icon: 'success', title: 'Tersimpan', text: `Baud rate: ${baud}`, timer: 1500, showConfirmButton: false });
    });

    document.getElementById('forgetPort').addEventListener('click', async function () {
      if (window.serialConnector) await window.serialConnector.forgetPort();
      Swal.fire({ icon: 'info', title: 'Port Dilupakan', text: 'Pilih port baru dengan klik SAMBUNGKAN', timer: 2000, showConfirmButton: false });
    });

    // ─── Init ─────────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async function () {
      await loadSessionInfo();
      await loadSuppliers();
      await loadDrivers();
      await loadFieldSettings();


      // Init baud rate display
      const savedBaud = localStorage.getItem('serialBaudRate') || '9600';
      document.getElementById('currentBaudRate').textContent = savedBaud;

      // Auto-init Serial Connector (from auto-serial-connect.js)
      // Will be initialized after script loads
      setTimeout(initSerialConnector, 500);
    });

    async function initSerialConnector() {
      if (typeof AutoSerialConnector === 'undefined') {
        setTimeout(initSerialConnector, 200);
        return;
      }

      let indicatorModel = 'generic';
      let customRegex = '';
      try {
        const res = await fetch('/setup/settings');
        const r = await res.json();
        if (r.success && r.data) {
          indicatorModel = r.data.serial_indicator_model || 'generic';
          customRegex = r.data.serial_custom_regex || '';
        }
      } catch (e) { console.error(e); }

      window.serialConnector = new AutoSerialConnector({
        targetInputId: 'beratInputForm',
        indicatorModel: indicatorModel,
        customRegex: customRegex,
        autoReconnect: true,
        maxReconnectAttempts: 10,
        reconnectInterval: 3000,
        onConnect: () => {
          document.getElementById('weightStatus').textContent = 'Terhubung ✓';
          document.getElementById('weightStatus').style.color = '#10b981';
          document.getElementById('toggleConnection').innerHTML = '<svg class="icon" aria-hidden="true"><use href="#i-plug-fill"></use></svg> PUTUSKAN';
          document.getElementById('toggleConnection').className = 'btn btn-danger w-full mt-4';
        },
        onDisconnect: () => {
          document.getElementById('weightDisplay').textContent = '0 KG';
          document.getElementById('weightStatus').textContent = 'Terputus';
          document.getElementById('weightStatus').style.color = '#ef4444';
          document.getElementById('toggleConnection').innerHTML = '<svg class="icon" aria-hidden="true"><use href="#i-plug-fill"></use></svg> SAMBUNGKAN';
          document.getElementById('toggleConnection').className = 'btn btn-info w-full mt-4 text-white';
        },
        onData: (weight) => {
          const wd = document.getElementById('weightDisplay');
          wd.textContent = Math.floor(weight).toLocaleString('id-ID') + ' KG';
          wd.dataset.rawWeight = Math.floor(weight);
        },
        onError: (err) => {
          console.error('Serial error:', err);
          document.getElementById('weightStatus').textContent = 'Error: ' + (err.message || err);
          document.getElementById('weightStatus').style.color = '#f59e0b';
        }
      });

      // Auto connect
      window.serialConnector.autoConnect({ maxRetries: 10, skipValidation: true, autoPrompt: true });

      // Toggle button
      document.getElementById('toggleConnection').addEventListener('click', async function () {
        if (window.serialConnector.isConnected) {
          await window.serialConnector.disconnect();
        } else {
          await window.serialConnector.manualConnect();
        }
      });
    }

    // ─── PENTING: Tutup port saat pindah halaman ──────────────────────────────
    window.addEventListener('beforeunload', function () {
      if (window.serialConnector && window.serialConnector.isConnected) {
        try {
          window.serialConnector.isConnected = false;
          if (window.serialConnector.reader) {
            window.serialConnector.reader.cancel().catch(() => { });
            try { window.serialConnector.reader.releaseLock(); } catch (e) { }
          }
          if (window.serialConnector.port) {
            window.serialConnector.port.close().catch(() => { });
          }
        } catch (e) { /* ignore */ }
      }
    });
  </script>
  <script src="/js/icons.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/sidebar.js"></script>
</body>

</html>
